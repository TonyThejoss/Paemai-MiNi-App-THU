<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>รายงานผู้ค้าค้างชำระแยกโซน — แพไม้มินิ</title>
<style>
:root{
  --g:#7c2d12;--gm:#c2410c;--gb:#ea580c;--gl:#ffedd5;--gll:#fff7ed;
  --r:#b91c1c;--rl:#fee2e2;--o:#c2410c;--ol:#fff7ed;
  --y:#92400e;--yl:#fffbeb;
  --bg:#eef2f0;--sf:#fff;--sf2:#f4f8f5;--bd:#d0ddd5;--bd2:#c7b4a0;
  --tx:#0a1a10;--txm:#4c3c2c;--txl:#9c7c5b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;}
.toolbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--g),var(--gm));color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.25);flex-wrap:wrap;gap:8px;}
.toolbar h1{font-size:.86rem;font-weight:800;}
.toolbar p{font-size:.62rem;opacity:.75;}
.tb-actions{display:flex;gap:8px;}
.tb-btn{padding:7px 14px;border:none;border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.tb-btn.print{background:#fff;color:var(--gm);}
.tb-btn.back{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);}
.tb-btn.refresh{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);}
.page{max-width:1040px;margin:18px auto;background:#fff;padding:26px 30px;border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,.08);}
.r-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--gm);padding-bottom:12px;margin-bottom:14px;}
.r-brand{font-size:1.05rem;font-weight:800;color:var(--g);}
.r-sub{font-size:.68rem;color:var(--txl);margin-top:1px;}
.r-meta{text-align:right;font-size:.66rem;color:var(--txl);}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0;}
.kc{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:9px 8px;text-align:center;}
.kc .n{font-size:1.15rem;font-weight:800;color:var(--r);}
.kc .l{font-size:.6rem;color:var(--txl);margin-top:2px;}
.zone-section{margin-top:18px;}
.zone-head{display:flex;align-items:center;justify-content:space-between;background:var(--g);color:#fff;padding:7px 12px;border-radius:7px 7px 0 0;font-size:.78rem;font-weight:800;}
.zone-head .zsub{font-size:.66rem;font-weight:600;opacity:.85;}
table{width:100%;border-collapse:collapse;font-size:.70rem;margin-bottom:6px;}
th{background:var(--sf3,#e8f0eb);color:var(--g);padding:5px 6px;text-align:left;font-size:.60rem;text-transform:uppercase;border-bottom:2px solid var(--gm);}
td{padding:5px 6px;border-bottom:1px solid var(--bd);}
tbody tr:nth-child(even) td{background:var(--sf2);}
tfoot.zone-total td{font-weight:800;background:var(--rl);border-top:2px solid var(--r);color:var(--r);}
.grand-total{margin-top:14px;background:var(--g);color:#fff;border-radius:8px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:.84rem;font-weight:800;}
.phone-link{color:var(--gm);text-decoration:none;font-weight:700;}
.other-note{font-size:.62rem;color:var(--txl);display:block;margin-top:1px;}
.foot{text-align:center;font-size:.6rem;color:var(--txl);margin-top:18px;padding-top:10px;border-top:1px solid var(--bd);}
.warn{background:var(--yl);border:1.5px solid var(--y);border-radius:8px;padding:8px 12px;font-size:.7rem;color:var(--y);font-weight:700;margin-bottom:14px;}
.empty{text-align:center;padding:24px;color:var(--txl);font-size:.78rem;}
.loading{text-align:center;padding:40px;color:var(--txl);font-size:.85rem;}
@media print{
  body{background:#fff;}
  .toolbar{display:none;}
  .page{box-shadow:none;margin:0;max-width:100%;padding:0;border-radius:0;}
  .zone-section{page-break-inside:avoid;}
  @page{size:A4 landscape;margin:12mm;}
}

.ic{width:1em;height:1em;vertical-align:-.15em;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic-dot{stroke:none}
</style>
<!-- ==== PM_MOBILE_KIT:START (สร้างโดย tools/inject_mobile_kit.py — ห้ามแก้ในไฟล์นี้) ==== -->
<style id="pm-mobile-kit">
/* ═══════════════════════════════════════════════════════════════════════════
   PM MOBILE KIT — Mobile-First / Responsive / Thai typography (2026-07-26)
   เป้าหมาย: ทุกหน้าใช้งานได้เต็มจอบนสมาร์ทโฟนทุกขนาด ไม่มีเนื้อหาล้นขอบจอด้านข้าง
   (no horizontal overflow), ตัวอักษรไทยตัดบรรทัดถูกต้อง, ปุ่มกดง่ายด้วยนิ้วโป้ง,
   เว้นระยะขอบบน-ล่างไม่ให้ชิดจอ
   หมายเหตุเชิงเทคนิค: ตั้งใจ "ไม่" ใส่ viewport-fit=cover เพราะถ้าไม่ใส่ เบราว์เซอร์จะกันพื้นที่
   รอยบาก (notch) ให้อยู่แล้วโดยอัตโนมัติ การใส่ cover แล้วจัดการ env() เองมีความเสี่ยงที่เนื้อหา
   จะไปอยู่ใต้รอยบากถ้าพลาดจุดใดจุดหนึ่ง — เราจึงใช้ env() เป็น "ระยะเสริม" (max()) เท่านั้น
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1) พื้นฐาน: กันล้นขอบจอ + ฟอนต์ไทย ── */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
*, *::before, *::after { min-width: 0; }               /* ตัวการอันดับ 1 ของ overflow ใน flex/grid */
body {
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun",
               "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui,
               "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: break-word;                           /* ตัดเฉพาะเมื่อคำเดียวยาวเกินกรอบ */
  word-break: normal;                                  /* ห้าม break-all — ทำให้ไทยตัดกลางพยางค์ */
  line-break: auto;
}
img, svg, canvas, video, table { max-width: 100%; }
input, select, textarea, button { font-family: inherit; max-width: 100%; }

/* ── 2) ตารางเลื่อนแนวนอนได้เอง (wrapper ถูกใส่ให้อัตโนมัติโดยสคริปต์ท้ายไฟล์) ── */
.pm-tablewrap {
  width: 100%; max-width: 100%; overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
}
.pm-tablewrap > table { min-width: 100%; }

/* ── 3) แท็บเล็ต ── */
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr !important; }
  .g2 { grid-template-columns: 1fr !important; }
  .kgrid, .kpi-grid, .kpi-row, .mgrid, .summary-grid { grid-template-columns: repeat(3, 1fr) !important; }
}

/* ── 4) สมาร์ทโฟน ── */
@media (max-width: 640px) {
  body { padding-bottom: max(18px, env(safe-area-inset-bottom)); }

  /* กริดสรุป/KPI → 2 คอลัมน์ อ่านง่ายกว่าบีบ 5 ช่องในจอ 360px */
  .kgrid, .kpi-grid, .kpi-row, .mgrid, .summary-grid,
  .elec-types, .grid { grid-template-columns: repeat(2, 1fr) !important; }
  /* ฟอร์ม 2 ช่องต่อแถว → 1 ช่องต่อแถว */
  .frow, .m-row, .field-row { grid-template-columns: 1fr !important; }

  /* แถบหัวเรื่อง/เครื่องมือ: ให้ห่อบรรทัดได้ ไม่ดันจนล้นจอ */
  .toolbar, .topbar, .tb-actions, .filter-row, .action-btns,
  .modal-btns, .option-row, .date-filter, .items-title, .summary-title {
    flex-wrap: wrap !important;
  }
  .toolbar, .topbar { padding-left: 12px !important; padding-right: 12px !important; row-gap: 8px; }
  .toolbar { padding-top: max(10px, env(safe-area-inset-top)) !important; }
  .topbar  { padding-top: max(10px, env(safe-area-inset-top)) !important; }

  /* พื้นที่กดขั้นต่ำ 44px ตาม WCAG 2.5.5 / Apple HIG — ผู้จัดตลาดกดด้วยนิ้วโป้งกลางตลาด */
  button, .btn, .tb-btn, a.btn, input[type=checkbox], input[type=radio] { min-height: 40px; }
  /* ปุ่มไอคอนเล็ก ๆ ที่ฝังในช่องกรอก (เช่น ปุ่มดู/ซ่อนรหัสผ่าน) และลิงก์ในเมนู */
  .pw-eye, .icon-btn, .btn-rm { min-width: 40px; min-height: 40px; }
  .ni, .sidebar a, a.ni { min-height: 44px; }
  input[type=checkbox], input[type=radio] { min-width: 22px; min-height: 22px; }
  .btn-sm, .tb-btn { min-height: 38px; }
  /* iOS ซูมเองถ้า font-size < 16px ในช่องกรอก — ล็อคไว้ที่ 16px กัน layout เพี้ยน */
  input, select, textarea { font-size: 16px !important; }

  /* หน้ารายงาน: ตัดกรอบกระดาษ A4 ออกบนมือถือให้ใช้ความกว้างเต็มจอ */
  .page { margin: 10px auto !important; padding: 14px 12px !important; border-radius: 8px !important; }
  .r-head { flex-direction: column; gap: 6px; }
  .r-meta { text-align: left !important; }
  .sign-area { flex-direction: column; gap: 18px; align-items: flex-start; }

  /* หน้ารับชำระหลายล็อค (batch payment) — เดิมไม่มี @media เลย
     .layout เป็น flex 2 คอลัมน์ + height:100vh + overflow:hidden ทำให้ฝั่งขวาหลุดออกนอกจอ
     และเลื่อนดูไม่ได้บนมือถือ → เปลี่ยนเป็นเรียงลงล่างและให้หน้าเลื่อนตามปกติ */
  .layout {
    flex-direction: column !important; height: auto !important;
    min-height: 0 !important; overflow: visible !important;
  }
  .left-panel, .right-panel {
    width: 100% !important; max-width: 100% !important; flex: none !important;
    border-right: none !important; border-left: none !important;
  }
  .right-scroll { overflow: visible !important; padding: 14px 12px !important; }
  .lock-item { flex-wrap: wrap; }

  /* โมดัล: สูงไม่เกินจอ เลื่อนในตัวได้ ไม่ชิดขอบล่าง */
  .modal, .modal-box, .m-box, .modal-content, .confirm-box {
    max-width: calc(100vw - 20px) !important;
    max-height: calc(100vh - 40px) !important;
    overflow-y: auto !important;
    margin-bottom: max(10px, env(safe-area-inset-bottom));
  }

  /* แถบเมนู/sidebar ที่เลื่อนแนวนอน */
  .sidebar, .side, .nav { max-width: 100% !important; }
}

/* ── 5) จอเล็กมาก (iPhone SE / 320-360px) ── */
@media (max-width: 380px) {
  .kgrid, .kpi-grid, .kpi-row, .mgrid, .summary-grid { grid-template-columns: 1fr !important; }
  .toolbar h1, .topbar h1 { font-size: .82rem !important; }
}

/* ── 6) โหมดแนวนอนจอเตี้ย: อย่าล็อคความสูงเป็น 100vh ── */
@media (max-height: 480px) and (orientation: landscape) {
  .layout { height: auto !important; overflow: visible !important; }
}

/* ── 7) พิมพ์: ยกเลิกทุกอย่างของ mobile kit ที่อาจกวนการพิมพ์รายงาน ── */
@media print {
  .pm-tablewrap { overflow: visible !important; }
  body { padding-bottom: 0 !important; overflow: visible !important; }
}
</style>
<script id="pm-mobile-kit-js">
/* ครอบ <table> ทุกตัวด้วยกล่องเลื่อนแนวนอน เพื่อไม่ให้ตารางกว้างดันหน้าจอล้น
   ทำด้วย JS เพราะแก้ CSS ล้วนไม่ได้ (ต้องมี element ครอบ) และทำแบบนี้ไม่กระทบ layout เดิมบนเดสก์ท็อป
   ใช้ MutationObserver เพราะเกือบทุกหน้าสร้างตารางด้วย innerHTML หลังโหลดข้อมูลจาก Sheets เสร็จ */
(function () {
  function wrapTables(root) {
    var tables = (root || document).querySelectorAll ? (root || document).querySelectorAll('table') : [];
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i];
      if (t.parentElement && t.parentElement.classList.contains('pm-tablewrap')) continue;
      if (t.closest && t.closest('.pm-tablewrap')) continue;
      var w = document.createElement('div');
      w.className = 'pm-tablewrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    }
  }
  function boot() {
    wrapTables(document);
    try {
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          for (var j = 0; j < muts[i].addedNodes.length; j++) {
            var n = muts[i].addedNodes[j];
            if (n.nodeType !== 1) continue;
            if (n.tagName === 'TABLE') { wrapTables(n.parentNode); }
            else if (n.querySelector && n.querySelector('table')) { wrapTables(n); }
          }
        }
      }).observe(document.body, { childList: true, subtree: true });
    } catch (e) { /* เบราว์เซอร์เก่า — ยังได้ตารางชุดแรกที่ wrap ไปแล้ว */ }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<!-- ==== PM_MOBILE_KIT:END ==== -->

<style id="pm-report-filter-css">
.pm-fbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:14px;
  background:var(--sf2,#f4f8f5);border:1px solid var(--bd,#d0ddd5);border-radius:10px;padding:10px 12px;}
.pm-fgrp{display:flex;flex-direction:column;gap:3px;min-width:0;}
.pm-fgrp>label{font-size:.64rem;font-weight:800;color:var(--txm,#4c3c2c);letter-spacing:.01em;}
.pm-fbar select,.pm-fbar input{padding:6px 9px;border:1.5px solid var(--bd,#d0ddd5);border-radius:7px;
  font-size:.76rem;font-family:inherit;background:#fff;color:var(--tx,#0a1a10);min-height:34px;}
.pm-fbar .pm-fbtn{padding:7px 14px;background:var(--gm,#c2410c);color:#fff;border:none;border-radius:7px;
  font-size:.74rem;font-weight:800;cursor:pointer;font-family:inherit;min-height:34px;}
.pm-fbar .pm-fbtn.ghost{background:transparent;color:var(--gm,#c2410c);border:1.5px solid var(--gm,#c2410c);}

.pm-fsum{font-size:.68rem;color:var(--txl,#9c7c5b);width:100%;margin-top:2px;}

.pm-hidden{display:none !important;}
@media (max-width:640px){
  .pm-fbar{gap:8px;padding:10px;}
  .pm-fgrp{flex:1 1 calc(50% - 8px);}
  .pm-fgrp.pm-wide{flex:1 1 100%;}
  .pm-fbar select,.pm-fbar input{width:100%;}
  .pm-fbar .pm-fbtn{flex:1 1 calc(50% - 8px);}
}
@media print{ .pm-fbar{display:none !important;} }
</style>
<script id="pm-report-filter-js">
/* ═══════════════════════════════════════════════════════════════════════════
   PM REPORT FILTER KIT — ตัวกรองกลางของทุกรายงาน (2026-07-26)
   ใช้งานในไฟล์รายงาน:
     · PM_FILTER.mount({date:true, zone:true})  → สร้างแถบตัวกรอง (เรียกครั้งเดียวตอนโหลด)
     · PM_FILTER.apiParams()                    → {date:'YYYY-MM-DD'} | {from,to} | {month:'YYYY-MM'}
     · PM_FILTER.zone()                          → '' (ทุกโซน) หรือรหัสโซน
     · PM_FILTER.byZone(rows,'zone')             → กรองแถวตามโซนที่เลือก
     · PM_FILTER.label()                         → ข้อความช่วงเวลาที่เลือก สำหรับพาดหัวรายงาน
   ค่าเริ่มต้น: ทุกโซน + วันปัจจุบัน (ตามข้อกำหนด)
   ═══════════════════════════════════════════════════════════════════════════ */
window.PM_FILTER = (function () {
  var MONS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                   'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var MONS_ABBR = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var cfg = { date: true, zone: true, onChange: null };

  function pad(n) { return ('0' + n).slice(-2); }
  function todayISO() {
    var n = new Date();
    return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  }
  function isoToTH(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    if (p.length < 3) return iso;
    return parseInt(p[2], 10) + ' ' + MONS_ABBR[parseInt(p[1], 10) - 1] + ' ' + (parseInt(p[0], 10) + 543);
  }
  // วันตลาดล่าสุด — ตลาดเปิดสัปดาห์ละวัน รายงานประจำวันจึงมักต้องการวันนี้
  // (build.py แปลง getDay()===4 → ===4 ให้ฝั่งวันพฤหัสฯ อัตโนมัติ ห้ามเขียนรูปแบบอื่น)
  function isMarketDay(d) { return d.getDay() === 2; }
  function lastMarketDayISO() {
    var d = new Date();
    for (var i = 0; i < 7; i++) { if (isMarketDay(d)) break; d.setDate(d.getDate() - 1); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function zoneOptions() {
    // ดึงรายชื่อโซนจากตัวแปรผังโซนของรายงานนั้น ๆ (แต่ละฉบับใช้ชื่อไม่เหมือนกัน)
    // ทำแบบนี้เพื่อไม่ต้องมี MARKET_BLOCK ใหม่อีกบล็อค — โซนของสองตลาดต่างกันอยู่แล้วในตัวแปรเดิม
    var z = [];
    try {
      if (typeof ZONE_ORDER !== 'undefined' && ZONE_ORDER) z = [].concat(ZONE_ORDER);
      else if (typeof ZONE_TOTALS !== 'undefined' && ZONE_TOTALS) z = Object.keys(ZONE_TOTALS);
      else if (typeof ZONE_LOCKS !== 'undefined' && ZONE_LOCKS) z = Object.keys(ZONE_LOCKS);
      else if (typeof ZONE_GROUPS !== 'undefined' && ZONE_GROUPS) {
        Object.keys(ZONE_GROUPS).forEach(function (g) {
          var v = ZONE_GROUPS[g];
          if (Array.isArray(v)) z = z.concat(v);
        });
      }
    } catch (e) {}
    if (!z.length && window.PM_ZONES_FALLBACK) z = [].concat(window.PM_ZONES_FALLBACK);
    // ไม่ซ้ำ + คงลำดับเดิม
    var seen = {}, out = [];
    z.forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }

  function yearOptions() {
    var y = new Date().getFullYear(), out = [];
    for (var i = y + 1; i >= y - 4; i--) out.push(i);
    return out;
  }

  function html() {
    var zones = zoneOptions();
    var zoneHtml = cfg.zone ? (
      '<div class="pm-fgrp"><label for="pmf-zone">โซน</label>' +
      '<select id="pmf-zone"><option value="">ทุกโซน</option>' +
      zones.map(function (z) { return '<option value="' + z + '">โซน ' + z + '</option>'; }).join('') +
      '</select></div>') : '';
    if (!cfg.date) {
      return '<div class="pm-fbar">' + zoneHtml +
        '<div class="pm-fgrp"><label>&nbsp;</label>' +
        '<button class="pm-fbtn" onclick="PM_FILTER.apply()">ดูข้อมูล</button></div>' +
        '<div class="pm-fsum" id="pmf-sum"></div></div>';
    }
    var thisY = new Date().getFullYear(), thisM = new Date().getMonth() + 1;
    return '' +
      '<div class="pm-fbar">' +
        zoneHtml +
        '<div class="pm-fgrp"><label for="pmf-mode">ช่วงเวลา</label>' +
          '<select id="pmf-mode" onchange="PM_FILTER.modeChanged()">' +
            '<option value="day">วันเดียว</option>' +
            '<option value="range">ช่วงวันที่</option>' +
            '<option value="month">เดือน / ปี</option>' +
            '<option value="all">ทั้งหมด</option>' +
          '</select></div>' +
        '<div class="pm-fgrp" id="pmf-g-day"><label for="pmf-date">วันที่</label>' +
          '<input type="date" id="pmf-date" value="' + todayISO() + '"></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-from"><label for="pmf-from">ตั้งแต่วันที่</label>' +
          '<input type="date" id="pmf-from" value="' + todayISO() + '"></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-to"><label for="pmf-to">ถึงวันที่</label>' +
          '<input type="date" id="pmf-to" value="' + todayISO() + '"></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-month"><label for="pmf-month">เดือน</label>' +
          '<select id="pmf-month">' + MONS_FULL.map(function (m, i) {
            return '<option value="' + (i + 1) + '"' + (i + 1 === thisM ? ' selected' : '') + '>' + m + '</option>';
          }).join('') + '</select></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-year"><label for="pmf-year">ปี (พ.ศ.)</label>' +
          '<select id="pmf-year">' + yearOptions().map(function (y) {
            return '<option value="' + y + '"' + (y === thisY ? ' selected' : '') + '>' + (y + 543) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="pm-fgrp"><label>&nbsp;</label>' +
          '<button class="pm-fbtn" onclick="PM_FILTER.apply()">ดูข้อมูล</button></div>' +
        '<div class="pm-fgrp"><label>&nbsp;</label>' +
          '<button class="pm-fbtn ghost" onclick="PM_FILTER.lastMarketDay()" ' +
          'title="ตลาดเปิดสัปดาห์ละวัน — ปุ่มนี้ข้ามไปวันตลาดล่าสุดที่มีข้อมูล">วันตลาดล่าสุด</button></div>' +
        '<div class="pm-fsum" id="pmf-sum"></div>' +
      '</div>';
  }

  function el(id) { return document.getElementById(id); }
  function mode() { var m = el('pmf-mode'); return m ? m.value : 'day'; }

  function modeChanged() {
    var m = mode();
    var show = {
      day:   ['pmf-g-day'],
      range: ['pmf-g-from', 'pmf-g-to'],
      month: ['pmf-g-month', 'pmf-g-year'],
      all:   [],
    }[m] || [];
    ['pmf-g-day', 'pmf-g-from', 'pmf-g-to', 'pmf-g-month', 'pmf-g-year'].forEach(function (id) {
      var g = el(id); if (g) g.classList.add('pm-hidden');
    });
    show.forEach(function (id) { var g = el(id); if (g) g.classList.remove('pm-hidden'); });
  }

  function apiParams() {
    if (!cfg.date) return {};
    var m = mode();
    if (m === 'all') return {};
    if (m === 'month') {
      var y = el('pmf-year') ? el('pmf-year').value : new Date().getFullYear();
      var mo = el('pmf-month') ? el('pmf-month').value : (new Date().getMonth() + 1);
      return { month: y + '-' + pad(parseInt(mo, 10)) };
    }
    if (m === 'range') {
      var f = el('pmf-from') ? el('pmf-from').value : '';
      var t = el('pmf-to') ? el('pmf-to').value : '';
      if (f && t && f > t) { var tmp = f; f = t; t = tmp; }   // ผู้ใช้สลับวันที่ → จัดให้เอง ไม่ error
      var o = {}; if (f) o.from = f; if (t) o.to = t; return o;
    }
    var d = el('pmf-date') ? el('pmf-date').value : todayISO();
    return d ? { date: d } : {};
  }

  function monthKey() {
    // เดือนที่รายงานอ้างอิง (ใช้กับรายงานส่วนลด/ค่าเช่าที่คิดเป็นรายเดือน)
    var p = apiParams();
    if (p.month) return p.month;
    if (p.date) return String(p.date).slice(0, 7);
    if (p.from) return String(p.from).slice(0, 7);
    return todayISO().slice(0, 7);
  }

  function label() {
    if (!cfg.date) return zone() ? ('โซน ' + zone()) : 'ทุกโซน';
    var p = apiParams(), t;
    if (p.date) t = 'วันที่ ' + isoToTH(p.date);
    else if (p.month) {
      var pp = p.month.split('-');
      t = 'เดือน' + MONS_FULL[parseInt(pp[1], 10) - 1] + ' ' + (parseInt(pp[0], 10) + 543);
    } else if (p.from || p.to) t = isoToTH(p.from) + ' – ' + isoToTH(p.to);
    else t = 'ทั้งหมด (ทุกช่วงเวลา)';
    return t + ' · ' + (zone() ? 'โซน ' + zone() : 'ทุกโซน');
  }

  function zone() { var z = el('pmf-zone'); return z ? z.value : ''; }

  // เติมรายชื่อโซนจาก "ข้อมูลจริงที่รายงานเพิ่งโหลดมา" เมื่อหาจากตัวแปรผังโซนไม่ได้
  // เหตุผล: รายงาน 02/05/06 ไม่มีตัวแปร ZONE_ORDER/ZONE_TOTALS (ไม่มี MARKET_BLOCK:ZONES)
  // ตอนแรกจึงได้ dropdown ว่างเปล่า เลือกโซนไม่ได้เลย — ผิดข้อกำหนด "ทุกรายงานต้องเลือกโซนได้"
  // ตรวจพบจากการทดสอบบนเว็บไซต์จริงหลัง deploy (ไม่ใช่จากการอ่านโค้ด)
  var knownZones = {};
  function learnZones(rows, field) {
    var sel = el('pmf-zone');
    if (!sel || !Array.isArray(rows) || !rows.length) return;
    // สะสมโซนจาก "ทุกชุดข้อมูล" ที่รายงานโหลดมา ไม่ใช่ชุดแรกชุดเดียว
    // (เดิมพอเจอชุดแรกแล้วหยุด ทำให้รายงาน 02 ได้โซนเดียวจาก daily_bookings
    //  แล้วไม่เรียนรู้โซนที่เหลือจาก payments — ตรวจพบจากการทดสอบบนเว็บจริง)
    var f = field || 'zone', seen = knownZones;
    rows.forEach(function (r) {
      var v = r && r[f];
      if (!v) {   // ชีตที่ไม่มีคอลัมน์ zone (เช่น payments) → เดาจาก prefix ตัวอักษรของรหัสล็อค
        var m = String((r && (r.lock_id || r.lock)) || '').match(/^([A-Za-z]+)/);
        v = m ? m[1].toUpperCase() : '';
      }
      if (v) seen[String(v)] = 1;
    });
    var zs = Object.keys(seen).sort(function (a, b) {
      return a.localeCompare(b, undefined, { numeric: true });
    });
    if (!zs.length || zs.length === sel.options.length - 1) return;   // ไม่มีโซนใหม่ → ไม่ต้องสร้างใหม่
    var keep = sel.value;
    sel.innerHTML = '<option value="">ทุกโซน</option>' +
      zs.map(function (z) { return '<option value="' + z + '">โซน ' + z + '</option>'; }).join('');
    if (zs.indexOf(keep) >= 0) sel.value = keep;
  }

  function byZone(rows, field) {
    learnZones(rows, field);
    var z = zone();
    if (!z || !Array.isArray(rows)) return rows || [];
    var f = field || 'zone';
    return rows.filter(function (r) {
      if (r && r[f]) return String(r[f]) === z;
      // บางชีต (payments) ไม่มีคอลัมน์ zone — เดาจาก prefix ตัวอักษรของรหัสล็อคแทน
      var lock = r && (r.lock_id || r.lock || '');
      var m = String(lock).match(/^([A-Za-z]+)/);
      return m ? m[1].toUpperCase() === z.toUpperCase() : false;
    });
  }

  function syncSummary() {
    var s = el('pmf-sum');
    if (s) s.innerHTML = 'กำลังแสดง: <b>' + label() + '</b>';
  }

  function apply() {
    syncSummary();
    if (typeof cfg.onChange === 'function') cfg.onChange();
    else if (typeof window.render === 'function') window.render();
  }

  function lastMarketDay() {
    var m = el('pmf-mode'); if (m) m.value = 'day';
    modeChanged();
    var d = el('pmf-date'); if (d) d.value = lastMarketDayISO();
    apply();
  }

  function mount(opts) {
    cfg.date = !opts || opts.date !== false;
    cfg.zone = !opts || opts.zone !== false;
    if (opts && opts.onChange) cfg.onChange = opts.onChange;
    var holder = document.querySelector('.date-filter');
    if (holder) {
      holder.outerHTML = html();
    } else {
      var body = el('reportBody');
      if (!body) return;
      var div = document.createElement('div');
      div.innerHTML = html();
      body.parentNode.insertBefore(div.firstChild, body);
    }
    modeChanged();
    syncSummary();
  }

  return {
    mount: mount, apply: apply, modeChanged: modeChanged, apiParams: apiParams,
    zone: zone, byZone: byZone, learnZones: learnZones, label: label, monthKey: monthKey,
    lastMarketDay: lastMarketDay, isoToTH: isoToTH, todayISO: todayISO,
    lastMarketDayISO: lastMarketDayISO,
  };
})();
</script>
<!-- ==== PM_REPORT_FILTER:END ==== -->

<div class="page">

      <div class="r-sub">โทร 082-581-1144 · รายงานผู้ค้าค้างชำระ แยกตามโซน</div>

<script>
const MONS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function nowTH(){const n=new Date();return n.getDate()+' '+MONS[n.getMonth()]+' '+(n.getFullYear()+543);}
function baht(n){return '฿'+Math.round(n||0).toLocaleString();}

// ═══ AUTO-CONNECT v1.3: เชื่อมต่อ Google Sheets อัตโนมัติผ่านลิงก์ตั้งค่า (ตั้งครั้งเดียวต่อเครื่อง/เบราว์เซอร์) ═══
// เปิดผ่านลิงก์พิเศษที่มี ?api=URL ต่อท้าย (ส่งให้พนักงานทางแชทภายใน ไม่เผยแพร่ในซอร์สโค้ดสาธารณะ)
// ระบบจะบันทึกอัตโนมัติแล้วลบพารามิเตอร์ออกจาก URL ทันที ครั้งต่อไปไม่ต้องกดซ้ำ (อ่านจาก localStorage เหมือนเดิม)
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var apiParam=p.get('api');
    if(apiParam){
      localStorage.setItem('pm-thu-api-url',decodeURIComponent(apiParam));
      p.delete('api');
      var clean=location.pathname+(p.toString()?('?'+p.toString()):'')+location.hash;
      history.replaceState(null,'',clean);
    }
  }catch(e){}
})();
function getApiUrl(){return (localStorage.getItem('pm-thu-api-url')||localStorage.getItem('pm-api-url'))||'';}
function getApiToken(){return (localStorage.getItem('pm-thu-api-token')||localStorage.getItem('pm-api-token'))||'';}
async function apiGet(action,params={}){
  const url=getApiUrl(); if(!url) return null;
  try{
    const r=await fetch(url+'?'+new URLSearchParams({action,token:getApiToken(),...params}));
    const j=await r.json();
    return j.status==='ok'?j.data:null;
  }catch(e){ console.error('apiGet error:',action,e); return null; }
}
function countThursdaysInMonth(year, month){
  let count=0; const d=new Date(year, month, 1);
  while(d.getMonth()===month){ if(d.getDay()===4) count++; d.setDate(d.getDate()+1); }
  return count;
}
function thisMonthThursdays(){ const n=new Date(); return countThursdaysInMonth(n.getFullYear(), n.getMonth()); }
function calcElec(v){ // ค่าไฟรายเดือน = ราคา/วันพฤหัสบดี × จำนวนวันพฤหัสบดี + รวม elec_special ที่เดิมตกหล่น (แก้ 2026-07-17 บั๊ก #27)
  const sp = (Array.isArray(v.elec_special)?v.elec_special:[]).reduce((s,x)=>s+(parseFloat(x.price)||0),0);
  const perTue = (parseInt(v.elec_bulb)||0)*10+(parseInt(v.elec_fan)||0)*20+(parseInt(v.elec_small)||0)*50+(parseInt(v.elec_large)||0)*100+sp;
  return Math.round(perTue * thisMonthThursdays());
}
function monthlyRent(v){ return (parseFloat(v.dailyRate)||0) * thisMonthThursdays(); }

// ลำดับโซนตามผังตลาดจริง: โรงหน้า → โรงใหญ่ → โซนด้านนอก
//== MARKET_BLOCK:ZONES ==//
const ZONE_ORDER = ['A','B','C','D','E','F','G','J','K','N','U','O','M','H','L','T','AB','TA','TB','TC'];
const ZONE_GROUP_NAME = {
  A:'โซนด้านนอก', B:'โซนด้านนอก', C:'โซนด้านนอก', D:'โซนด้านนอก', E:'โซนด้านนอก', F:'โซนด้านนอก',
  G:'ข้าง 7-Eleven', J:'ข้าง 7-Eleven', K:'ข้าง 7-Eleven', N:'ข้าง 7-Eleven', U:'ข้าง 7-Eleven',
  O:'ข้างโลตัส', M:'ข้างโลตัส', H:'ข้างโลตัส', L:'ข้างโลตัส', T:'ข้างโลตัส', AB:'ข้างโลตัส',
  TA:'เปิดท้าย', TB:'เปิดท้าย', TC:'เปิดท้าย',
};
//== END_MARKET_BLOCK ==//

async function render(){
  document.getElementById('r-date').textContent = nowTH();
  document.getElementById('r-stamp').textContent = nowTH() + ' ' + new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('reportBody').innerHTML = '<div class="loading">⏳ กำลังโหลดข้อมูลจาก Google Sheets...</div>';
  document.getElementById('dataWarn').innerHTML = '';

  if(!getApiUrl()){
    document.getElementById('dataWarn').innerHTML =
      '<div class="warn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ยังไม่ได้เชื่อมต่อ Google Sheets — กรุณาตั้งค่าที่หน้าหลักของระบบก่อน</div>';
    document.getElementById('reportBody').innerHTML = '';
    return;
  }

  // กรองตามโซนที่เลือกในแถบตัวกรองกลาง (ว่าง = ทุกโซน) — เพิ่ม 2026-07-26 /* PM_ZONE_WIRED */
  const vendors = PM_FILTER.byZone(await apiGet('getVendors') || [], 'zone');
  const unpaid = vendors.filter(v=>v.status==='unpaid');
  const tuesdays = thisMonthThursdays();

  // คำนวณยอดค้างแต่ละล็อค: ค่าเช่ารายเดือน + ค่าไฟ + ค่าปรับค้างจ่าย + ค่าอื่นค้างจ่าย
  const withDebt = unpaid.map(v=>{
    const rent = monthlyRent(v);
    const elec = calcElec(v);
    const penalty = parseFloat(v.unpaid_penalty)||0;
    const other = parseFloat(v.unpaid_other)||0;
    const otherLabel = v.unpaid_other_label||'';
    const total = rent + elec + penalty + other;
    return {...v, rent, elec, penalty, other, otherLabel, total};
  });

  const totalDebt = withDebt.reduce((s,v)=>s+v.total,0);
  const zonesWithDebt = [...new Set(withDebt.map(v=>v.zone))].length;

  let html = `
  <div class="kgrid">
    <div class="kc"><div class="n">${withDebt.length}</div><div class="l">ผู้ค้าค้างชำระ</div></div>
    <div class="kc"><div class="n">${zonesWithDebt}</div><div class="l">โซนที่มีค้างชำระ</div></div>
    <div class="kc"><div class="n">${tuesdays}</div><div class="l">วันพฤหัสบดีเดือนนี้</div></div>
    <div class="kc"><div class="n" style="font-size:.95rem">${baht(totalDebt)}</div><div class="l">ยอดค้างรวมทั้งหมด</div></div>
  </div>`;

  if(withDebt.length===0){
    html += '<div class="empty"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> ไม่มีผู้ค้าค้างชำระในขณะนี้</div>';
  } else {
    // จัดกลุ่มตามโซน
    const byZone = {};
    withDebt.forEach(v=>{
      if(!byZone[v.zone]) byZone[v.zone]=[];
      byZone[v.zone].push(v);
    });
    // เรียงโซนตามลำดับผังตลาดจริง ตามด้วยโซนที่ไม่อยู่ใน list (กันเหนียว)
    const zoneKeys = Object.keys(byZone).sort((a,b)=>{
      const ia = ZONE_ORDER.indexOf(a), ib = ZONE_ORDER.indexOf(b);
      return (ia<0?999:ia) - (ib<0?999:ib);
    });

    zoneKeys.forEach(zone=>{
      const list = byZone[zone].sort((a,b)=>a.lock.localeCompare(b.lock,undefined,{numeric:true}));
      const zoneTotal = list.reduce((s,v)=>s+v.total,0);
      const groupName = ZONE_GROUP_NAME[zone] || '—';

      html += `<div class="zone-section">
        <div class="zone-head"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg> โซน ${zone} (${groupName})</span><span class="zsub">${list.length} ล็อคค้างชำระ · รวม ${baht(zoneTotal)}</span></div>
        <table>
          <thead><tr>
            <th style="width:22px">#</th><th>ล็อค</th><th>ร้านค้า</th><th>เบอร์โทร</th>
            <th style="text-align:right">ค่าเช่า/เดือน</th>
            <th style="text-align:right">ค่าไฟ</th>
            <th style="text-align:right">ค่าปรับค้าง</th>
            <th>ค่าอื่นค้าง</th>
            <th style="text-align:right">ยอดค้างรวม</th>
          </tr></thead>
          <tbody>`;

      list.forEach((v,i)=>{
        const phoneHtml = v.phone && v.phone!=='—' ? `<a class="phone-link" href="tel:${v.phone}">${v.phone}</a>` : '—';
        const otherCell = v.other>0
          ? `${baht(v.other)}${v.otherLabel?`<span class="other-note">${v.otherLabel}</span>`:''}`
          : '—';
        html += `<tr>
          <td>${i+1}</td>
          <td><strong>${v.lock}</strong></td>
          <td>${v.name||'(ยังไม่ระบุ)'}</td>
          <td>${phoneHtml}</td>
          <td style="text-align:right">${baht(v.rent)}</td>
          <td style="text-align:right">${v.elec>0?baht(v.elec):'—'}</td>
          <td style="text-align:right">${v.penalty>0?baht(v.penalty):'—'}</td>
          <td>${otherCell}</td>
          <td style="text-align:right;font-weight:800;color:var(--r)">${baht(v.total)}</td>
        </tr>`;
      });

      html += `</tbody>
          <tfoot class="zone-total"><tr><td colspan="8">รวมโซน ${zone}</td><td style="text-align:right">${baht(zoneTotal)}</td></tr></tfoot>
        </table>
      </div>`;
    });

    html += `<div class="grand-total"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5c0-1.1 1.1-2 2.5-2s2.5.9 2.5 2-1.1 1.6-2.5 2-2.5.9-2.5 2 1.1 2 2.5 2 2.5-.9 2.5-2"/></svg> ยอดค้างชำระรวมทั้งหมดทุกโซน</span><span>${baht(totalDebt)}</span></div>`;
  }

  document.getElementById('reportBody').innerHTML = html;
}

PM_FILTER.mount({ date: false, zone: true, onChange: render });  // PM_WIRED_MOUNT

render();
</script>
