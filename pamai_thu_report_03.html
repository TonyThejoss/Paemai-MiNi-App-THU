<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>รายงานล็อคว่างแยกโซน — แพไม้มินิ</title>
<style>
:root{
  --g:#7c2d12;--gm:#c2410c;--gb:#ea580c;--gl:#ffedd5;--gll:#fff7ed;
  --r:#b91c1c;--rl:#fee2e2;--o:#c2410c;--ol:#fff7ed;
  --y:#92400e;--yl:#fffbeb;
  --bg:#eef2f0;--sf:#fff;--sf2:#f4f8f5;--bd:#d0ddd5;--bd2:#c7b4a0;
  --tx:#0a1a10;--txm:#4c3c2c;--txl:#9c7c5b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;}
.toolbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--g),var(--gm));color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.toolbar h1{font-size:.86rem;font-weight:800;}
.toolbar p{font-size:.62rem;opacity:.75;}
.tb-actions{display:flex;gap:8px;}
.tb-btn{padding:7px 14px;border:none;border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
.tb-btn.print{background:#fff;color:var(--gm);}
.tb-btn.back{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);}
.tb-btn.refresh{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);}
.page{max-width:860px;margin:18px auto;background:#fff;padding:26px 30px;border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,.08);}
.r-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--gm);padding-bottom:12px;margin-bottom:14px;}
.r-brand{font-size:1.05rem;font-weight:800;color:var(--g);}
.r-sub{font-size:.68rem;color:var(--txl);margin-top:1px;}
.r-meta{text-align:right;font-size:.66rem;color:var(--txl);}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.kc{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:9px 8px;text-align:center;}
.kc .n{font-size:1.3rem;font-weight:800;color:var(--y);}
.kc .l{font-size:.6rem;color:var(--txl);margin-top:2px;}
.r-title{font-size:.88rem;font-weight:800;margin:14px 0 6px;padding-bottom:5px;border-bottom:1.5px solid var(--bd);}
table{width:100%;border-collapse:collapse;font-size:.72rem;margin-bottom:10px;}
th{background:var(--g);color:#fff;padding:6px 8px;text-align:left;font-size:.62rem;text-transform:uppercase;}
td{padding:5px 8px;border-bottom:1px solid var(--bd);}
tbody tr:nth-child(even) td{background:var(--sf2);}
.zone-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.6rem;font-weight:800;background:var(--gl);color:var(--g);}
.foot{text-align:center;font-size:.6rem;color:var(--txl);margin-top:18px;padding-top:10px;border-top:1px solid var(--bd);}
.warn{background:var(--yl);border:1.5px solid var(--y);border-radius:8px;padding:8px 12px;font-size:.7rem;color:var(--y);font-weight:700;margin-bottom:14px;}
.empty{text-align:center;padding:20px;color:var(--txl);font-size:.78rem;}
.loading{text-align:center;padding:40px;color:var(--txl);font-size:.85rem;}
@media print{
  body{background:#fff;}
  .toolbar{display:none;}
  .page{box-shadow:none;margin:0;max-width:100%;padding:0;border-radius:0;}
  @page{size:A4 portrait;margin:14mm;}
}

.ic{width:1em;height:1em;vertical-align:-.15em;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic-dot{stroke:none}









/* ==== PM_THEME_KIT:START (สร้างโดย tools/inject_theme_kit.py — ห้ามแก้ในไฟล์นี้) ==== */
[data-theme="dark"]{--bg:#090f0b;--sf:#0f1a13;--sf2:#141f17;--bd:#243028;--bd2:#534230;--tx:#eadad0;--txm:#b59a80;--txl:#b4997e;--gl:#2d1200;--gll:#1a0f06;--rl:#1f0a0a;--ol:#1a0f06;--bl:#091228;--yl:#120f06;}
/* กระดาษรายงาน: เดิม background:#fff ตายตัว ทำให้โหมดมืดยังเป็นแผ่นขาวจ้ากลางจอดำ */
.page{background:var(--sf) !important;color:var(--tx);}
[data-theme="dark"] .page{box-shadow:0 2px 16px rgba(0,0,0,.5);}
[data-theme="dark"] body{background:var(--bg);}
[data-theme="dark"] .tb-btn.print{background:var(--sf2);color:var(--tx);}
/* ตาราง/เส้นคั่นในรายงานที่อ้างสีขาวหรือเทาอ่อนตายตัว */
[data-theme="dark"] th,[data-theme="dark"] td{border-color:var(--bd);}
[data-theme="dark"] thead th{background:var(--sf2);color:var(--tx);}
[data-theme="dark"] tbody tr:nth-child(even){background:rgba(255,255,255,.03);}
/* ชื่อหัวรายงานใช้ --g (เขียวเข้มสุด) ซึ่งออกแบบมาสำหรับพื้นกระดาษขาว พอพื้นเป็นสีมืดจะกลายเป็น
   เขียวเข้มบนดำ อ่านแทบไม่ออก — ในโหมดมืดจึงยกไปใช้เฉดสว่างของธีมแทน (คู่ส้มมีอยู่แล้วใน build.py) */
[data-theme="dark"] .r-brand,[data-theme="dark"] .r-title,
[data-theme="dark"] .r-head strong{color:#efac86;}
[data-theme="dark"] .r-head{border-bottom-color:var(--bd2);}

.dm-btn.pm-theme-btn{width:40px;height:40px;min-height:40px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;
  cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s;flex-shrink:0;}
.dm-btn.pm-theme-btn:hover{background:rgba(255,255,255,.24);transform:rotate(18deg);}
@media print{.dm-btn.pm-theme-btn{display:none !important;}}
/* ==== PM_THEME_KIT:END ==== */
</style>
<!-- ==== PM_MOBILE_KIT:START (สร้างโดย tools/inject_mobile_kit.py — ห้ามแก้ในไฟล์นี้) ==== -->
<style id="pm-mobile-kit">
/* ═══════════════════════════════════════════════════════════════════════════
   PM MOBILE KIT — Mobile-First / Responsive / Thai typography (2026-07-26)
   เป้าหมาย: ทุกหน้าใช้งานได้เต็มจอบนสมาร์ทโฟนทุกขนาด ไม่มีเนื้อหาล้นขอบจอด้านข้าง
   (no horizontal overflow), ตัวอักษรไทยตัดบรรทัดถูกต้อง, ปุ่มกดง่ายด้วยนิ้วโป้ง,
   เว้นระยะขอบบน-ล่างไม่ให้ชิดจอ
   หมายเหตุเชิงเทคนิค: ตั้งใจ "ไม่" ใส่ viewport-fit=cover เพราะถ้าไม่ใส่ เบราว์เซอร์จะกันพื้นที่
   รอยบาก (notch) ให้อยู่แล้วโดยอัตโนมัติ การใส่ cover แล้วจัดการ env() เองมีความเสี่ยงที่เนื้อหา
   จะไปอยู่ใต้รอยบากถ้าพลาดจุดใดจุดหนึ่ง — เราจึงใช้ env() เป็น "ระยะเสริม" (max()) เท่านั้น
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1) พื้นฐาน: กันล้นขอบจอ + ฟอนต์ไทย ── */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
*, *::before, *::after { min-width: 0; }               /* ตัวการอันดับ 1 ของ overflow ใน flex/grid */
body {
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun",
               "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui,
               "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: break-word;                           /* ตัดเฉพาะเมื่อคำเดียวยาวเกินกรอบ */
  word-break: normal;                                  /* ห้าม break-all — ทำให้ไทยตัดกลางพยางค์ */
  line-break: auto;
}
img, svg, canvas, video, table { max-width: 100%; }
input, select, textarea, button { font-family: inherit; max-width: 100%; }

/* ── 1.5) แถบที่ตั้งใจให้ "เลื่อนแนวนอน" ต้องเลื่อนจริง ห้ามบีบจนตัวอักษรทับกัน ──
   ข้อ 1) ด้านบนตั้ง min-width:0 ให้ทุก element เพื่อกัน overflow ในแนวตั้ง/แนวกริด ซึ่งถูกต้อง
   แต่มีผลข้างเคียงกับแถบแท็บ/แถบโซนที่เป็น flex + overflow-x:auto — ลูก ๆ ยอมหดต่ำกว่าความกว้าง
   เนื้อหาของตัวเอง ผลคือแทนที่จะเลื่อนได้ กลับบีบซ้อนกันจนอ่านไม่ออก (พบที่แถบแท็บหน้าค่าไฟฟ้า
   บนจอ 390px: "รายชื่อผู้ค้า + ค่าไฟ / แก้ไขค่าไฟรายล็อค / สรุปบิลประจำเดือน / ประวัติค่าไฟ" ทับกัน)
   จึงยกเว้นเฉพาะลูกโดยตรงของแถบเหล่านี้ให้ไม่หด แล้วปล่อยให้ผู้ใช้ปัดนิ้วเลื่อนตามที่ออกแบบไว้ */
.main-tabs, .tabs, .zone-bar, .outdoor-strip, .steps, .stepbar {
  -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scrollbar-width: none;
}
.main-tabs > *, .tabs > *, .zone-bar > *, .outdoor-strip > *, .steps > *, .stepbar > * {
  flex-shrink: 0; min-width: max-content;
}
.main-tabs::-webkit-scrollbar, .tabs::-webkit-scrollbar, .zone-bar::-webkit-scrollbar,
.outdoor-strip::-webkit-scrollbar, .steps::-webkit-scrollbar,
.stepbar::-webkit-scrollbar { display: none; }
/* .stepbar (แถบ 4 ขั้นตอนหน้าลงทะเบียนผู้ค้าใหม่) ไม่ได้ตั้ง overflow-x ไว้แต่แรก และลูกเป็น flex:1
   บนจอ 390px จึงถูกบีบจนคำไทยตัดเป็นแนวตั้งทีละตัวอักษร ("ข-้-อ-ม-ู-ล-ผ-ู-้-ค-้-า") อ่านไม่ได้เลย
   → ให้เลื่อนแนวนอนแทน และยกเลิก flex:1 เพื่อให้แต่ละขั้นตอนกว้างตามข้อความจริง */
.stepbar { overflow-x: auto; }
.stepbar > .step { flex: none !important; }

/* ── 2) ตารางเลื่อนแนวนอนได้เอง (wrapper ถูกใส่ให้อัตโนมัติโดยสคริปต์ท้ายไฟล์) ── */
.pm-tablewrap {
  width: 100%; max-width: 100%; overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
}
.pm-tablewrap > table { min-width: 100%; }

/* ── 3) แท็บเล็ต ── */
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr !important; }
  .g2 { grid-template-columns: 1fr !important; }
  .kgrid, .kpi-grid, .kpi-row, .mgrid, .summary-grid { grid-template-columns: repeat(3, 1fr) !important; }
}

/* ── 4) สมาร์ทโฟน ── */
@media (max-width: 640px) {
  body { padding-bottom: max(18px, env(safe-area-inset-bottom)); }

  /* กริดสรุป/KPI → 2 คอลัมน์ อ่านง่ายกว่าบีบ 5 ช่องในจอ 360px */
  .kgrid, .kpi-grid, .kpi-row, .mgrid, .summary-grid,
  .elec-types, .grid { grid-template-columns: repeat(2, 1fr) !important; }
  /* ฟอร์ม 2 ช่องต่อแถว → 1 ช่องต่อแถว */
  .frow, .m-row, .field-row { grid-template-columns: 1fr !important; }

  /* แถบหัวเรื่อง/เครื่องมือ: ให้ห่อบรรทัดได้ ไม่ดันจนล้นจอ */
  .toolbar, .topbar, .tb-actions, .filter-row, .action-btns,
  .modal-btns, .option-row, .date-filter, .items-title, .summary-title {
    flex-wrap: wrap !important;
  }
  .toolbar, .topbar { padding-left: 12px !important; padding-right: 12px !important; row-gap: 8px; }
  .toolbar { padding-top: max(10px, env(safe-area-inset-top)) !important; }
  .topbar  { padding-top: max(10px, env(safe-area-inset-top)) !important; }

  /* พื้นที่กดขั้นต่ำ 44px ตาม WCAG 2.5.5 / Apple HIG — ผู้จัดตลาดกดด้วยนิ้วโป้งกลางตลาด */
  button, .btn, .tb-btn, a.btn, input[type=checkbox], input[type=radio] { min-height: 40px; }
  /* ปุ่มไอคอนเล็ก ๆ ที่ฝังในช่องกรอก (เช่น ปุ่มดู/ซ่อนรหัสผ่าน) และลิงก์ในเมนู */
  .pw-eye, .icon-btn, .btn-rm { min-width: 40px; min-height: 40px; }
  .ni, .sidebar a, a.ni { min-height: 44px; }
  input[type=checkbox], input[type=radio] { min-width: 22px; min-height: 22px; }
  .btn-sm, .tb-btn { min-height: 38px; }
  /* iOS ซูมเองถ้า font-size < 16px ในช่องกรอก — ล็อคไว้ที่ 16px กัน layout เพี้ยน */
  input, select, textarea { font-size: 16px !important; }

  /* หน้ารายงาน: ตัดกรอบกระดาษ A4 ออกบนมือถือให้ใช้ความกว้างเต็มจอ */
  .page { margin: 10px auto !important; padding: 14px 12px !important; border-radius: 8px !important; }
  .r-head { flex-direction: column; gap: 6px; }
  .r-meta { text-align: left !important; }
  .sign-area { flex-direction: column; gap: 18px; align-items: flex-start; }

  /* หน้ารับชำระหลายล็อค (batch payment) — เดิมไม่มี @media เลย
     .layout เป็น flex 2 คอลัมน์ + height:100vh + overflow:hidden ทำให้ฝั่งขวาหลุดออกนอกจอ
     และเลื่อนดูไม่ได้บนมือถือ → เปลี่ยนเป็นเรียงลงล่างและให้หน้าเลื่อนตามปกติ

     ⚠️ บทเรียนบั๊ก 2569-07-27 (จอดำบนมือถือ): กฎก้อนนี้เคยเขียนเป็น `.layout` เปล่า ๆ แล้วไป
     ชนกับ `.layout` ของ shell ในหน้าแอพหลัก (ซึ่งต้องมีความสูงแน่นอน = 100vh − topbar
     ไม่งั้น iframe ของทุกโมดูลจะยุบเหลือ 150px แล้วที่เหลือกลายเป็นพื้นหลังเปล่า)
     กติกาใหม่: ห้ามใช้ชื่อคลาสกว้าง ๆ เป็นตัวเลือกลอย ๆ อีก — หน้าไหนต้องการให้คอลัมน์เรียงลงล่าง
     บนมือถือ ต้อง "ขอเอง" ด้วยการติดคลาส .pm-stack-mobile ที่ตัว .layout ของหน้านั้น
     (ทำแบบ opt-in ไม่ใช้ :has() เพราะถ้าเบราว์เซอร์เก่าไม่รู้จัก :has() ทั้งกฎจะถูกทิ้งทั้งก้อน) */
  .layout.pm-stack-mobile {
    flex-direction: column !important; height: auto !important;
    min-height: 0 !important; overflow: visible !important;
  }

  /* shell ของแอพหลัก: ย้ำความสูงให้แน่นอนเสมอ กัน iframe โมดูลยุบเหลือ 150px */
  .app-shell { height: calc(100vh - var(--topH, 56px)) !important; overflow: hidden !important; }
  .app-shell > .content, .app-shell .pane, .app-shell .pane.active { min-height: 0; }
  .module-frame { min-height: 0; height: 100% !important; }
  .left-panel, .right-panel {
    width: 100% !important; max-width: 100% !important; flex: none !important;
    border-right: none !important; border-left: none !important;
  }
  .right-scroll { overflow: visible !important; padding: 14px 12px !important; }
  .lock-item { flex-wrap: wrap; }

  /* โมดัล: สูงไม่เกินจอ เลื่อนในตัวได้ ไม่ชิดขอบล่าง */
  .modal, .modal-box, .m-box, .modal-content, .confirm-box {
    max-width: calc(100vw - 20px) !important;
    max-height: calc(100vh - 40px) !important;
    overflow-y: auto !important;
    margin-bottom: max(10px, env(safe-area-inset-bottom));
  }

  /* แถบเมนู/sidebar ที่เลื่อนแนวนอน */
  .sidebar, .side, .nav { max-width: 100% !important; }
}

/* ── 5) จอเล็กมาก (iPhone SE / 320-360px) ── */
@media (max-width: 380px) {
  .kgrid, .kpi-grid, .kpi-row, .mgrid, .summary-grid { grid-template-columns: 1fr !important; }
  .toolbar h1, .topbar h1 { font-size: .82rem !important; }
}

/* ── 6) โหมดแนวนอนจอเตี้ย: อย่าล็อคความสูงเป็น 100vh ──
   (ใช้เฉพาะหน้าที่ opt-in เท่านั้น ด้วยเหตุผลเดียวกับข้อ 4 — shell ของแอพต้องคงความสูงไว้) */
@media (max-height: 480px) and (orientation: landscape) {
  .layout.pm-stack-mobile { height: auto !important; overflow: visible !important; }
}

/* ── 7) พิมพ์: ยกเลิกทุกอย่างของ mobile kit ที่อาจกวนการพิมพ์รายงาน ── */
@media print {
  .pm-tablewrap { overflow: visible !important; }
  body { padding-bottom: 0 !important; overflow: visible !important; }
}
</style>
<script id="pm-mobile-kit-js">
/* ครอบ <table> ทุกตัวด้วยกล่องเลื่อนแนวนอน เพื่อไม่ให้ตารางกว้างดันหน้าจอล้น
   ทำด้วย JS เพราะแก้ CSS ล้วนไม่ได้ (ต้องมี element ครอบ) และทำแบบนี้ไม่กระทบ layout เดิมบนเดสก์ท็อป
   ใช้ MutationObserver เพราะเกือบทุกหน้าสร้างตารางด้วย innerHTML หลังโหลดข้อมูลจาก Sheets เสร็จ */
(function () {
  function wrapTables(root) {
    var tables = (root || document).querySelectorAll ? (root || document).querySelectorAll('table') : [];
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i];
      if (t.parentElement && t.parentElement.classList.contains('pm-tablewrap')) continue;
      if (t.closest && t.closest('.pm-tablewrap')) continue;
      var w = document.createElement('div');
      w.className = 'pm-tablewrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    }
  }
  function boot() {
    wrapTables(document);
    try {
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          for (var j = 0; j < muts[i].addedNodes.length; j++) {
            var n = muts[i].addedNodes[j];
            if (n.nodeType !== 1) continue;
            if (n.tagName === 'TABLE') { wrapTables(n.parentNode); }
            else if (n.querySelector && n.querySelector('table')) { wrapTables(n); }
          }
        }
      }).observe(document.body, { childList: true, subtree: true });
    } catch (e) { /* เบราว์เซอร์เก่า — ยังได้ตารางชุดแรกที่ wrap ไปแล้ว */ }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script id="pm-report-filter-js">
/* ═══════════════════════════════════════════════════════════════════════════
   PM REPORT FILTER KIT — ตัวกรองกลางของทุกรายงาน (2026-07-26)
   ใช้งานในไฟล์รายงาน:
     · PM_FILTER.mount({date:true, zone:true})  → สร้างแถบตัวกรอง (เรียกครั้งเดียวตอนโหลด)
     · PM_FILTER.apiParams()                    → {date:'YYYY-MM-DD'} | {from,to} | {month:'YYYY-MM'}
     · PM_FILTER.zone()                          → '' (ทุกโซน) หรือรหัสโซน
     · PM_FILTER.byZone(rows,'zone')             → กรองแถวตามโซนที่เลือก
     · PM_FILTER.label()                         → ข้อความช่วงเวลาที่เลือก สำหรับพาดหัวรายงาน
   ค่าเริ่มต้น: ทุกโซน + วันปัจจุบัน (ตามข้อกำหนด)
   ═══════════════════════════════════════════════════════════════════════════ */
window.PM_FILTER = (function () {
  var MONS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                   'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var MONS_ABBR = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var cfg = { date: true, zone: true, onChange: null };

  function pad(n) { return ('0' + n).slice(-2); }
  function todayISO() {
    var n = new Date();
    return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  }
  function isoToTH(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    if (p.length < 3) return iso;
    return parseInt(p[2], 10) + ' ' + MONS_ABBR[parseInt(p[1], 10) - 1] + ' ' + (parseInt(p[0], 10) + 543);
  }
  // วันตลาดล่าสุด — ตลาดเปิดสัปดาห์ละวัน รายงานประจำวันจึงมักต้องการวันนี้
  // (build.py แปลง getDay()===4 → ===4 ให้ฝั่งวันพฤหัสฯ อัตโนมัติ ห้ามเขียนรูปแบบอื่น)
  function isMarketDay(d) { return d.getDay() === 2; }
  function lastMarketDayISO() {
    var d = new Date();
    for (var i = 0; i < 7; i++) { if (isMarketDay(d)) break; d.setDate(d.getDate() - 1); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function zoneOptions() {
    // ดึงรายชื่อโซนจากตัวแปรผังโซนของรายงานนั้น ๆ (แต่ละฉบับใช้ชื่อไม่เหมือนกัน)
    // ทำแบบนี้เพื่อไม่ต้องมี MARKET_BLOCK ใหม่อีกบล็อค — โซนของสองตลาดต่างกันอยู่แล้วในตัวแปรเดิม
    var z = [];
    try {
      if (typeof ZONE_ORDER !== 'undefined' && ZONE_ORDER) z = [].concat(ZONE_ORDER);
      else if (typeof ZONE_TOTALS !== 'undefined' && ZONE_TOTALS) z = Object.keys(ZONE_TOTALS);
      else if (typeof ZONE_LOCKS !== 'undefined' && ZONE_LOCKS) z = Object.keys(ZONE_LOCKS);
      else if (typeof ZONE_GROUPS !== 'undefined' && ZONE_GROUPS) {
        Object.keys(ZONE_GROUPS).forEach(function (g) {
          var v = ZONE_GROUPS[g];
          if (Array.isArray(v)) z = z.concat(v);
        });
      }
    } catch (e) {}
    if (!z.length && window.PM_ZONES_FALLBACK) z = [].concat(window.PM_ZONES_FALLBACK);
    // ไม่ซ้ำ + คงลำดับเดิม
    var seen = {}, out = [];
    z.forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }

  function yearOptions() {
    var y = new Date().getFullYear(), out = [];
    for (var i = y + 1; i >= y - 4; i--) out.push(i);
    return out;
  }

  function html() {
    var zones = zoneOptions();
    var zoneHtml = cfg.zone ? (
      '<div class="pm-fgrp"><label for="pmf-zone">โซน</label>' +
      '<select id="pmf-zone"><option value="">ทุกโซน</option>' +
      zones.map(function (z) { return '<option value="' + z + '">โซน ' + z + '</option>'; }).join('') +
      '</select></div>') : '';
    if (!cfg.date) {
      return '<div class="pm-fbar">' + zoneHtml +
        '<div class="pm-fgrp"><label>&nbsp;</label>' +
        '<button class="pm-fbtn" onclick="PM_FILTER.apply()">ดูข้อมูล</button></div>' +
        '<div class="pm-fsum" id="pmf-sum"></div></div>';
    }
    var thisY = new Date().getFullYear(), thisM = new Date().getMonth() + 1;
    return '' +
      '<div class="pm-fbar">' +
        zoneHtml +
        '<div class="pm-fgrp"><label for="pmf-mode">ช่วงเวลา</label>' +
          '<select id="pmf-mode" onchange="PM_FILTER.modeChanged()">' +
            '<option value="day">วันเดียว</option>' +
            '<option value="range">ช่วงวันที่</option>' +
            '<option value="month">เดือน / ปี</option>' +
            '<option value="all">ทั้งหมด</option>' +
          '</select></div>' +
        '<div class="pm-fgrp" id="pmf-g-day"><label for="pmf-date">วันที่</label>' +
          '<input type="date" id="pmf-date" value="' + todayISO() + '"></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-from"><label for="pmf-from">ตั้งแต่วันที่</label>' +
          '<input type="date" id="pmf-from" value="' + todayISO() + '"></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-to"><label for="pmf-to">ถึงวันที่</label>' +
          '<input type="date" id="pmf-to" value="' + todayISO() + '"></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-month"><label for="pmf-month">เดือน</label>' +
          '<select id="pmf-month">' + MONS_FULL.map(function (m, i) {
            return '<option value="' + (i + 1) + '"' + (i + 1 === thisM ? ' selected' : '') + '>' + m + '</option>';
          }).join('') + '</select></div>' +
        '<div class="pm-fgrp pm-hidden" id="pmf-g-year"><label for="pmf-year">ปี (พ.ศ.)</label>' +
          '<select id="pmf-year">' + yearOptions().map(function (y) {
            return '<option value="' + y + '"' + (y === thisY ? ' selected' : '') + '>' + (y + 543) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="pm-fgrp"><label>&nbsp;</label>' +
          '<button class="pm-fbtn" onclick="PM_FILTER.apply()">ดูข้อมูล</button></div>' +
        '<div class="pm-fgrp"><label>&nbsp;</label>' +
          '<button class="pm-fbtn ghost" onclick="PM_FILTER.lastMarketDay()" ' +
          'title="ตลาดเปิดสัปดาห์ละวัน — ปุ่มนี้ข้ามไปวันตลาดล่าสุดที่มีข้อมูล">วันตลาดล่าสุด</button></div>' +
        '<div class="pm-fsum" id="pmf-sum"></div>' +
      '</div>';
  }

  function el(id) { return document.getElementById(id); }
  function mode() { var m = el('pmf-mode'); return m ? m.value : 'day'; }

  function modeChanged() {
    var m = mode();
    var show = {
      day:   ['pmf-g-day'],
      range: ['pmf-g-from', 'pmf-g-to'],
      month: ['pmf-g-month', 'pmf-g-year'],
      all:   [],
    }[m] || [];
    ['pmf-g-day', 'pmf-g-from', 'pmf-g-to', 'pmf-g-month', 'pmf-g-year'].forEach(function (id) {
      var g = el(id); if (g) g.classList.add('pm-hidden');
    });
    show.forEach(function (id) { var g = el(id); if (g) g.classList.remove('pm-hidden'); });
  }

  function apiParams() {
    if (!cfg.date) return {};
    var m = mode();
    if (m === 'all') return {};
    if (m === 'month') {
      var y = el('pmf-year') ? el('pmf-year').value : new Date().getFullYear();
      var mo = el('pmf-month') ? el('pmf-month').value : (new Date().getMonth() + 1);
      return { month: y + '-' + pad(parseInt(mo, 10)) };
    }
    if (m === 'range') {
      var f = el('pmf-from') ? el('pmf-from').value : '';
      var t = el('pmf-to') ? el('pmf-to').value : '';
      if (f && t && f > t) { var tmp = f; f = t; t = tmp; }   // ผู้ใช้สลับวันที่ → จัดให้เอง ไม่ error
      var o = {}; if (f) o.from = f; if (t) o.to = t; return o;
    }
    var d = el('pmf-date') ? el('pmf-date').value : todayISO();
    return d ? { date: d } : {};
  }

  function monthKey() {
    // เดือนที่รายงานอ้างอิง (ใช้กับรายงานส่วนลด/ค่าเช่าที่คิดเป็นรายเดือน)
    var p = apiParams();
    if (p.month) return p.month;
    if (p.date) return String(p.date).slice(0, 7);
    if (p.from) return String(p.from).slice(0, 7);
    return todayISO().slice(0, 7);
  }

  function label() {
    if (!cfg.date) return zone() ? ('โซน ' + zone()) : 'ทุกโซน';
    var p = apiParams(), t;
    if (p.date) t = 'วันที่ ' + isoToTH(p.date);
    else if (p.month) {
      var pp = p.month.split('-');
      t = 'เดือน' + MONS_FULL[parseInt(pp[1], 10) - 1] + ' ' + (parseInt(pp[0], 10) + 543);
    } else if (p.from || p.to) t = isoToTH(p.from) + ' – ' + isoToTH(p.to);
    else t = 'ทั้งหมด (ทุกช่วงเวลา)';
    return t + ' · ' + (zone() ? 'โซน ' + zone() : 'ทุกโซน');
  }

  function zone() { var z = el('pmf-zone'); return z ? z.value : ''; }

  // เติมรายชื่อโซนจาก "ข้อมูลจริงที่รายงานเพิ่งโหลดมา" เมื่อหาจากตัวแปรผังโซนไม่ได้
  // เหตุผล: รายงาน 02/05/06 ไม่มีตัวแปร ZONE_ORDER/ZONE_TOTALS (ไม่มี MARKET_BLOCK:ZONES)
  // ตอนแรกจึงได้ dropdown ว่างเปล่า เลือกโซนไม่ได้เลย — ผิดข้อกำหนด "ทุกรายงานต้องเลือกโซนได้"
  // ตรวจพบจากการทดสอบบนเว็บไซต์จริงหลัง deploy (ไม่ใช่จากการอ่านโค้ด)
  var knownZones = {};
  function learnZones(rows, field) {
    var sel = el('pmf-zone');
    if (!sel || !Array.isArray(rows) || !rows.length) return;
    // สะสมโซนจาก "ทุกชุดข้อมูล" ที่รายงานโหลดมา ไม่ใช่ชุดแรกชุดเดียว
    // (เดิมพอเจอชุดแรกแล้วหยุด ทำให้รายงาน 02 ได้โซนเดียวจาก daily_bookings
    //  แล้วไม่เรียนรู้โซนที่เหลือจาก payments — ตรวจพบจากการทดสอบบนเว็บจริง)
    var f = field || 'zone', seen = knownZones;
    rows.forEach(function (r) {
      var v = r && r[f];
      if (!v) {   // ชีตที่ไม่มีคอลัมน์ zone (เช่น payments) → เดาจาก prefix ตัวอักษรของรหัสล็อค
        var m = String((r && (r.lock_id || r.lock)) || '').match(/^([A-Za-z]+)/);
        v = m ? m[1].toUpperCase() : '';
      }
      if (v) seen[String(v)] = 1;
    });
    var zs = Object.keys(seen).sort(function (a, b) {
      return a.localeCompare(b, undefined, { numeric: true });
    });
    if (!zs.length || zs.length === sel.options.length - 1) return;   // ไม่มีโซนใหม่ → ไม่ต้องสร้างใหม่
    var keep = sel.value;
    sel.innerHTML = '<option value="">ทุกโซน</option>' +
      zs.map(function (z) { return '<option value="' + z + '">โซน ' + z + '</option>'; }).join('');
    if (zs.indexOf(keep) >= 0) sel.value = keep;
  }

  function byZone(rows, field) {
    learnZones(rows, field);
    var z = zone();
    if (!z || !Array.isArray(rows)) return rows || [];
    var f = field || 'zone';
    return rows.filter(function (r) {
      if (r && r[f]) return String(r[f]) === z;
      // บางชีต (payments) ไม่มีคอลัมน์ zone — เดาจาก prefix ตัวอักษรของรหัสล็อคแทน
      var lock = r && (r.lock_id || r.lock || '');
      var m = String(lock).match(/^([A-Za-z]+)/);
      return m ? m[1].toUpperCase() === z.toUpperCase() : false;
    });
  }

  function syncSummary() {
    var s = el('pmf-sum');
    if (s) s.innerHTML = 'กำลังแสดง: <b>' + label() + '</b>';
  }

  function apply() {
    syncSummary();
    if (typeof cfg.onChange === 'function') cfg.onChange();
    else if (typeof window.render === 'function') window.render();
  }

  function lastMarketDay() {
    var m = el('pmf-mode'); if (m) m.value = 'day';
    modeChanged();
    var d = el('pmf-date'); if (d) d.value = lastMarketDayISO();
    apply();
  }

  function mount(opts) {
    cfg.date = !opts || opts.date !== false;
    cfg.zone = !opts || opts.zone !== false;
    if (opts && opts.onChange) cfg.onChange = opts.onChange;
    var holder = document.querySelector('.date-filter');
    if (holder) {
      holder.outerHTML = html();
    } else {
      var body = el('reportBody');
      if (!body) return;
      var div = document.createElement('div');
      div.innerHTML = html();
      body.parentNode.insertBefore(div.firstChild, body);
    }
    modeChanged();
    syncSummary();
  }

  return {
    mount: mount, apply: apply, modeChanged: modeChanged, apiParams: apiParams,
    zone: zone, byZone: byZone, learnZones: learnZones, label: label, monthKey: monthKey,
    lastMarketDay: lastMarketDay, isoToTH: isoToTH, todayISO: todayISO,
    lastMarketDayISO: lastMarketDayISO,
  };
})();
</script>

        localStorage.setItem(MODE_MIGRATION_KEY, 'done');
        /* session เดิมมาจาก Sheets และไม่มี Supabase session token. ลบทิ้งหนึ่งครั้ง
           เฉพาะหน้าหลักเท่านั้น: iframe ผังใช้ sessionStorage ร่วมกับหน้าหลักในบางเบราว์เซอร์
           จึงห้าม iframe ลบ token ของหน้าที่ผู้ใช้เพิ่งล็อกอินอยู่ ไม่เช่นนั้นผังจะตอบ 401/ว่าง. */
        if (window.top === window) try { sessionStorage.removeItem('pmthu-session'); } catch (e) {}
      }
    } catch (e) {}
  }
  /* ต้องทำทันทีใน head ก่อนโค้ดเดิมเริ่ม restore session/โหลดข้อมูล ไม่ใช่รอให้
     apiGet ถูกเรียกครั้งแรก (ซึ่งช้าเกินไปและทำให้ Sheets ชนะในรอบแรก). */
  migrateExistingDevice();
  function mode() {
    migrateExistingDevice();
    try { return localStorage.getItem(MODE_KEY) || 'supabase'; } catch (e) { return 'supabase'; }
  }

  function sbFetch(action, payload) {
    /* ทุก action วิ่งผ่านฟังก์ชัน api() ตัวเดียวที่ฐานข้อมูล — ตารางทั้งหมดถูกปิดจาก
       การเข้าถึงตรง ๆ ไว้แล้ว ต่อให้ key หลุดก็อ่าน/เขียนตารางเองไม่ได้ */
    var body = Object.assign({}, payload || {});
    /* token อยู่ใน sessionStorage เท่านั้น (ไม่ใช้ localStorage) และฐานข้อมูลเก็บแค่ hash
       ของมัน — action สาธารณะ/verifyUser ไม่ต้องมี token ส่วน action อื่นจะถูกปฏิเสธที่ RPC */
    try {
      var sess = JSON.parse(sessionStorage.getItem('pmthu-session') || 'null');
      /* iframe บางบริบทมี sessionStorage แยกจากหน้าแม่ แม้เป็น origin เดียวกัน.
         ใช้ token ของหน้าแม่เป็น fallback โดยไม่ส่งออกไปที่ใดนอกจาก RPC ของตลาดเดียวกัน. */
      if ((!sess || !sess.apiToken) && embeddedSession) {
        sess = JSON.parse(embeddedSession);
      }
      if ((!sess || !sess.apiToken) && window.parent && window.parent !== window && window.parent.__pmSessionBridge) {
        sess = JSON.parse(window.parent.__pmSessionBridge);
      }
      if ((!sess || !sess.apiToken) && window.parent && window.parent !== window) {
        sess = JSON.parse(window.parent.sessionStorage.getItem('pmthu-session') || 'null');
      }
      /* รายงานที่เปิดเป็นหน้าต่างใหม่มี opener เป็น launcher เดิม ไม่ใช่ parent. */
      if ((!sess || !sess.apiToken) && window.opener && window.opener.location.origin === window.location.origin) {
        sess = JSON.parse(window.opener.sessionStorage.getItem('pmthu-session') || 'null');
      }
      if (sess && sess.apiToken) body.sessionToken = sess.apiToken;
    } catch (e) {}
    return fetch(SB_URL + '/rest/v1/rpc/api', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action, payload: body })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 160)); });
      return r.json();
    });
  }

  window.PM_API = {
    mode: mode,
    setMode: function (m) {
      if (['sheets', 'parallel', 'supabase'].indexOf(m) < 0) { console.error('โหมดไม่ถูกต้อง:', m); return; }
      try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
      console.log('PM_API: สลับเป็นโหมด', m, '— รีเฟรชหน้าเพื่อให้มีผลทุกส่วน');
    },
    supabase: sbFetch,
    url: SB_URL,
    /* เทียบผลลัพธ์ Sheets กับ Supabase ของ action เดียวกัน — ใช้ตอนทดสอบคู่ขนาน */
    compare: async function (action, params) {
      var a = null, b = null;
      try { a = await window.__pmSheetsGet(action, params || {}); } catch (e) { a = 'ERROR ' + e.message; }
      try { b = (await sbFetch(action, params || {})).data; } catch (e) { b = 'ERROR ' + e.message; }
      var la = Array.isArray(a) ? a.length : typeof a;
      var lb = Array.isArray(b) ? b.length : typeof b;
      console.log('[' + action + '] Sheets:', la, ' Supabase:', lb, la === lb ? '✅ ตรงกัน' : '⚠️ ต่างกัน');
      return { sheets: a, supabase: b };
    }
  };
})();
</script>

<script>
const MONS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function nowTH(){const n=new Date();return n.getDate()+' '+MONS[n.getMonth()]+' '+(n.getFullYear()+543);}
function nowTime(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}

// ═══ AUTO-CONNECT v1.3: เชื่อมต่อ Google Sheets อัตโนมัติผ่านลิงก์ตั้งค่า (ตั้งครั้งเดียวต่อเครื่อง/เบราว์เซอร์) ═══
// เปิดผ่านลิงก์พิเศษที่มี ?api=URL ต่อท้าย (ส่งให้พนักงานทางแชทภายใน ไม่เผยแพร่ในซอร์สโค้ดสาธารณะ)
// ระบบจะบันทึกอัตโนมัติแล้วลบพารามิเตอร์ออกจาก URL ทันที ครั้งต่อไปไม่ต้องกดซ้ำ (อ่านจาก localStorage เหมือนเดิม)
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var apiParam=p.get('api');
    if(apiParam){
      localStorage.setItem('pm-thu-api-url',decodeURIComponent(apiParam));
      p.delete('api');
      var clean=location.pathname+(p.toString()?('?'+p.toString()):'')+location.hash;
      history.replaceState(null,'',clean);
    }
  }catch(e){}
})();
function getApiUrl(){return (localStorage.getItem('pm-thu-api-url')||localStorage.getItem('pm-api-url'))||'';}
function getApiToken(){return (localStorage.getItem('pm-thu-api-token')||localStorage.getItem('pm-api-token'))||'';}
async function apiGet(action,params={}){
  const url=getApiUrl(); if(!url) return null;
  try{
    const r=await fetch(url+'?'+new URLSearchParams({action,token:getApiToken(),...params}));
    const j=await r.json();
    return j.status==='ok'?j.data:null;
  }catch(e){ console.error('apiGet error:',action,e); return null; }
}

// ── ผังตลาดจริง ── เลขล็อคจริงตามผังตลาดของระบบ
//== MARKET_BLOCK:ZONES ==//
// ── ผังตลาดจริง ── เลขล็อคจริงตามผังตลาดของระบบ
const ZONE_LOCKS = {
  'A': Array.from({length:20},(_,i)=>'A'+(i+1)),
  'B': Array.from({length:20},(_,i)=>'B'+(i+1)),
  'C': Array.from({length:21},(_,i)=>'C'+(i+1)),
  'D': Array.from({length:22},(_,i)=>'D'+(i+1)),
  'E': Array.from({length:11},(_,i)=>'E'+(i+1)),
  'F': Array.from({length:16},(_,i)=>'F'+(i+1)),
  'G': Array.from({length:28},(_,i)=>'G'+(i+1)),
  'J': Array.from({length:4},(_,i)=>'J'+(i+1)),
  'K': Array.from({length:12},(_,i)=>'K'+(i+1)),
  'N': Array.from({length:8},(_,i)=>'N'+(i+1)),
  'U': ['U1','U3','U4','U5','U6'],
  'O': Array.from({length:13},(_,i)=>'O'+(i+1)),
  'M': Array.from({length:12},(_,i)=>'M'+(i+1)),
  'H': Array.from({length:12},(_,i)=>'H'+(i+1)),
  'L': Array.from({length:28},(_,i)=>'L'+(i+1)),
  'T': ['T1','T2'],
  'AB': ['AB4','AB5','AB6'],
  'TA': Array.from({length:20},(_,i)=>'TA'+(i+1)),
  'TB': Array.from({length:20},(_,i)=>'TB'+(i+1)),
  'TC': Array.from({length:20},(_,i)=>'TC'+(i+1)),
};
const ZONE_GROUP_NAME = {
  A:'โซนด้านนอก', B:'โซนด้านนอก', C:'โซนด้านนอก', D:'โซนด้านนอก', E:'โซนด้านนอก', F:'โซนด้านนอก',
  G:'ข้าง 7-Eleven', J:'ข้าง 7-Eleven', K:'ข้าง 7-Eleven', N:'ข้าง 7-Eleven', U:'ข้าง 7-Eleven',
  O:'ข้างโลตัส', M:'ข้างโลตัส', H:'ข้างโลตัส', L:'ข้างโลตัส', T:'ข้างโลตัส', AB:'ข้างโลตัส',
  TA:'เปิดท้าย', TB:'เปิดท้าย', TC:'เปิดท้าย',
};
//== END_MARKET_BLOCK ==//

function allLockIds(){
  const ids=[];
  Object.entries(ZONE_LOCKS).forEach(([zone,locks])=>{
    locks.forEach(id=>ids.push({zone, group:ZONE_GROUP_NAME[zone], id}));
  });
  return ids;
}

async function render(){
  document.getElementById('r-date').textContent = nowTH();
  document.getElementById('r-time').textContent = nowTime();
  document.getElementById('r-stamp').textContent = nowTH() + ' ' + nowTime();
  document.getElementById('reportBody').innerHTML = '<div class="loading">⏳ กำลังโหลดข้อมูลจาก Google Sheets...</div>';
  document.getElementById('dataWarn').innerHTML = '';

  if(!getApiUrl()){
    document.getElementById('dataWarn').innerHTML =
      '<div class="warn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ยังไม่ได้เชื่อมต่อ Google Sheets — กรุณาตั้งค่าที่หน้าหลักของระบบก่อน</div>';
    document.getElementById('reportBody').innerHTML = '';
    return;
  }

  // กรองตามโซนที่เลือกในแถบตัวกรองกลาง (ว่าง = ทุกโซน) — เพิ่ม 2026-07-26 /* PM_ZONE_WIRED */
  const vendors = PM_FILTER.byZone(await apiGet('getVendors') || [], 'zone');

  if(vendors.length === 0){
    document.getElementById('dataWarn').innerHTML =
      '<div class="warn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ยังไม่มีข้อมูลผู้ค้าใน Google Sheets — ล็อคทั้งหมดจะแสดงเป็น "ว่าง" ทั้งหมด จนกว่าจะมีการกรอกข้อมูลผู้ค้า</div>';
  }

  const occupiedLocks = new Set(vendors.filter(v=>v.status==='active'||v.status==='unpaid').map(v=>v.lock));
  const all = allLockIds();
  const vacant = all.filter(l=>!occupiedLocks.has(l.id));

  let html = `
  <div class="kgrid">
    <div class="kc"><div class="n">${vacant.length}</div><div class="l">ล็อคว่าง</div></div>
    <div class="kc"><div class="n">${all.length}</div><div class="l">จากทั้งหมด</div></div>
    <div class="kc"><div class="n">${all.length-vacant.length}</div><div class="l">มีผู้เช่า</div></div>
  </div>
  <div class="r-title">รายการล็อคว่างทั้งหมด (เรียงตามโซน)</div>`;

  if(vacant.length === 0){
    html += '<div class="empty"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> ไม่มีล็อคว่าง — เต็มทุกล็อค</div>';
  } else {
    html += `<table>
      <thead><tr><th>#</th><th>โซน</th><th>หมายเลขล็อค</th><th>หมวด</th></tr></thead>
      <tbody>`;
    vacant.forEach((l,i)=>{
      html += `<tr><td>${i+1}</td><td><span class="zone-pill">${l.zone}</span></td><td><strong>${l.id}</strong></td><td>${l.group}</td></tr>`;
    });
    html += '</tbody></table>';
  }

  document.getElementById('reportBody').innerHTML = html;
}

// ══════════════════════════════════════════════════════════════
// ต่อสายแถบตัวกรองกลาง (PM Report Filter Kit) — เพิ่ม 2026-07-26
// ค่าเริ่มต้นตามข้อกำหนด: ทุกโซน + วันปัจจุบัน · เปลี่ยนตัวกรองแล้วกด "ดูข้อมูล" เพื่อ render ใหม่
// ══════════════════════════════════════════════════════════════
PM_FILTER.mount({ date: false, zone: true, onChange: render });  // PM_WIRED_MOUNT

render();
</script>

function toggleDark(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('pmthu-t',d?'light':'dark');}

<script id="pm-api-shim">
/* apiGet/apiPost เวอร์ชันที่รองรับสามโหมด — เก็บของเดิมไว้เป็น __pmSheets* เพื่อใช้เทียบผล
   และเพื่อให้ย้อนกลับไปใช้ Google Sheets ได้ทันทีถ้าพบปัญหาหน้างาน (ทางถอย) */
(function () {
  /* ══════════════════════════════════════════════════════════════════════
     บั๊กร้ายแรงที่พบ 3 ส.ค. 2569 (ผู้ใช้แจ้งแค่อาการเดียว แต่ต้นเหตุกินไป 10 ไฟล์)

     เดิมบรรทัดนี้เขียนว่า:
         if (typeof apiGet !== 'function' || typeof apiPost !== 'function') return;

     หน้าที่ "อ่านอย่างเดียว" ไม่มีเหตุให้เขียนฟังก์ชัน apiPost เลย —
     ประวัติแจ้งลา และรายงาน 01–09 รวม 10 ไฟล์ มีแต่ apiGet
     shim ทั้งก้อนจึง return ทิ้งตั้งแต่บรรทัดแรกในไฟล์เหล่านั้น ผลคือ:
       · apiGet ไม่ถูกครอบ → ยังยิงไป Google Apps Script ทั้งที่ทั้งระบบย้ายมา Supabase แล้ว
       · getApiUrl() ไม่ถูกครอบ → คืนค่าว่าง (เครื่องใหม่ไม่มี URL ของ Apps Script)
         ทุกหน้าจึงตัดสินว่า "ยังไม่เชื่อมต่อ" แล้วขึ้นข้อความชวนไปตั้งค่า โดยไม่มี error ใด ๆ
     → หน้าประวัติแจ้งลาและรายงานทุกฉบับ **ไม่เคยเห็นข้อมูลจาก Supabase เลย** ตั้งแต่วันตัดจริง
       (อาการที่ผู้ใช้แจ้ง: "แจ้งลาแล้วแต่ประวัติไม่อัปเดต")

     เข้าเงื่อนไขกฎเหล็กข้อ 18 เป๊ะ ๆ อีกครั้ง — คราวนี้ตัวด่านเองเป็นคนปิดสวิตช์
     แก้: บังคับแค่ apiGet เท่านั้น ส่วน apiPost ครอบเมื่อมีจริง
     ══════════════════════════════════════════════════════════════════════ */
  if (typeof apiGet !== 'function') return;
  var _get = apiGet;
  var _post = (typeof apiPost === 'function') ? apiPost : null;
  window.__pmSheetsGet = _get;
  if (_post) window.__pmSheetsPost = _post;
  function notifySaved(action, result) {
    if (!result || result.status !== 'ok' || window.parent === window) return;
    try { window.parent.postMessage({ type: 'pm-data-changed', action: action }, '*'); } catch (e) {}
  }

  var _everFetched = false;   /* ใช้ตรวจว่าหน้านี้ "เคยขอข้อมูลผ่าน shim" แล้วหรือยัง (ดู kickIfNeverFetched) */

  window.apiGet = async function (action, params) {
    _everFetched = true;
    var m = window.PM_API ? window.PM_API.mode() : 'supabase';
    if (m === 'sheets') return _get(action, params);
    try {
      var r = await window.PM_API.supabase(action, params || {});
      return (r && r.status === 'ok') ? r.data : null;
    } catch (e) {
      console.error('Supabase apiGet ล้มเหลว:', action, e);
      /* โหมด parallel ยังมี Sheets เป็นตาข่ายรองรับ · โหมด supabase ล้วนต้องคืน null
         ให้ชั้นบน (PM_VENDOR_SYNC) แสดงแถบเตือนตามปกติ ไม่แอบกลับไปอ่านของเก่าเงียบ ๆ */
      return (m === 'parallel') ? _get(action, params) : null;
    }
  };

  /* หน้าอ่านอย่างเดียว (ประวัติแจ้งลา · รายงาน 01–09) ไม่มี apiPost — ข้ามส่วนนี้ไปได้เลย
     แต่ต้องไม่ข้ามทั้ง shim เหมือนเดิม เพราะ apiGet และ getApiUrl ยังต้องถูกครอบ */
  if (_post) window.apiPost = async function (action, data) {
    var m = window.PM_API ? window.PM_API.mode() : 'supabase';
    if (m === 'sheets') return _post(action, data);
    var sbRes = null, sbErr = null;
    try { sbRes = await window.PM_API.supabase(action, data || {}); }
    catch (e) { sbErr = e; console.error('Supabase apiPost ล้มเหลว:', action, e); }
    if (m === 'parallel') {
      /* เขียนลง Sheets ด้วยเพื่อให้ข้อมูลสองที่ตรงกันระหว่างช่วงทดสอบ
         ถ้าฝั่ง Supabase พลาด ให้ยึดผลจาก Sheets เป็นคำตอบ (ยังไม่ตัดของเก่าทิ้ง) */
      var shRes = null;
      try { shRes = await _post(action, data); } catch (e) {}
      var parallelRes = (sbRes && sbRes.status === 'ok') ? sbRes : shRes;
      notifySaved(action, parallelRes);
      return parallelRes;
    }
    if (sbErr) return { status: 'error', message: String(sbErr.message || sbErr) };
    notifySaved(action, sbRes);
    return sbRes;
  };

  /* ── ด่านที่ลืมไม่ได้: getApiUrl() ──
     ทั้งระบบใช้ `if(!getApiUrl())` เป็นตัวตัดสินว่า "เชื่อมต่อฐานข้อมูลแล้วหรือยัง"
     รวม 89 จุดใน 20 ไฟล์ (นับเมื่อ 28 ก.ค. 2026) — ไม่ใช่แค่ใช้เป็น URL เท่านั้น
     พอย้ายมา Supabase ค่าที่คืนคือ URL ของ Apps Script ซึ่งเครื่องใหม่ไม่มี ทุกด่านจึงตัด
     ฟีเจอร์ทิ้งเงียบ ๆ (ผังขึ้นว่างทั้งตลาด · ปุ่มบันทึกเตือนว่ายังไม่เชื่อมต่อ)
     จึงต้องครอบที่ฟังก์ชันนี้ด้วย ไม่ใช่แค่ apiGet/apiPost

     ⚠️ โหมด parallel ห้ามแทนค่า — เพราะ __pmSheetsPost ยังต้องยิงไป URL จริงของ Apps Script
        ถ้าคืน URL ของ Supabase ไปแทน ข้อมูลจะถูกส่งผิดที่ */
  if (typeof getApiUrl === 'function') {
    var _url = getApiUrl;
    window.__pmSheetsUrl = _url;
    window.getApiUrl = function () {
      var m = window.PM_API ? window.PM_API.mode() : 'supabase';
      var real = '';
      try { real = _url() || ''; } catch (e) {}
      if (m === 'supabase') return real || (window.PM_API ? window.PM_API.url : '');
      if (m === 'parallel' && !real) console.warn('PM_API: โหมด parallel ต้องตั้งค่า URL ของ Apps Script ด้วย');
      return real;
    };
  }

  /* ป้ายเดิมใน shell ถูกเขียนก่อน PM_API shim จะเริ่มทำงาน จึงค้างคำว่า Sheets
     ทั้งที่คำขอจริงวิ่งเข้า Supabase แล้ว. ปรับหลังหน้าโหลดเพื่อให้ผู้ใช้เห็นแหล่งข้อมูลจริง. */
  function refreshConnectionLabels() {
    if (!window.PM_API || window.PM_API.mode() !== 'supabase') return;
    var cloud = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19H9a5 5 0 1 1 1.6-9.7A6 6 0 0 1 22 11.5 4.5 4.5 0 0 1 17.5 19Z"/></svg>';
    var badge = document.getElementById('db-status-badge');
    var side = document.getElementById('db-status');
    if (badge) { badge.innerHTML = cloud + ' Supabase'; badge.title = 'Supabase'; }
    if (side) side.innerHTML = cloud + ' เชื่อมต่อ Supabase แล้ว';
  }
  setTimeout(refreshConnectionLabels, 1200);

  /* ══════════════════════════════════════════════════════════════════════
     PM_REFRESH_BUS (เพิ่ม 2026-08-03) — แก้บั๊ก "บันทึกแล้วแต่หน้าอื่นยังเป็นข้อมูลเก่า"

     ระบบมีสายส่งสัญญาณอยู่แล้วตั้งแต่ v2.2: โมดูลที่บันทึกสำเร็จยิง 'pm-data-changed'
     ขึ้นไปที่ shell → shell กระจาย 'pm-refresh' กลับลงมาทุก iframe
     แต่ "ปลายทาง" มีแค่ 2 ไฟล์ที่เขียน listener ไว้เอง (ผังตลาด + คิวจองล็อคจร)
     อีก 6 โมดูลไม่มีเลย — หน้าประวัติแจ้งลาจึงค้างข้อมูลเก่าจนกว่าจะกด F5 (อาการที่ผู้ใช้แจ้ง)

     แทนที่จะไล่ก๊อป listener ทีละไฟล์ (ซึ่งจะ drift แน่นอนตามกฎเหล็กข้อ 12/20)
     ฝังตัวรับกลางไว้ที่ shim นี้ ซึ่งถูก inject ลง "ทุกไฟล์" อยู่แล้ว
     แต่ละหน้าไม่ต้องรู้อะไรเลย — แค่มีฟังก์ชันโหลดข้อมูลชื่อใดชื่อหนึ่งใน RELOADERS

     ไฟล์ที่เขียน listener ของตัวเองไว้แล้วยังทำงานได้ปกติ (โหลดซ้ำสองรอบไม่เสียหาย
     เพราะทุกตัวเป็นการอ่านข้อมูลอย่างเดียว) และมี throttle 400ms กันยิงรัว
     ══════════════════════════════════════════════════════════════════════ */
  /* เรียงจาก "ชื่อเฉพาะของหน้านั้น" ก่อน — แต่ละหน้ามีตัวเดียวเท่านั้นในทางปฏิบัติ
     loadAll: ประวัติแจ้งลา, คิวจองล็อคจร · loadData: ผ่อนชำระ · loadStatus: หน้าสถานะสาธารณะ
     syncRealVendors: ผังตลาด · loadVendorsFromSheets: ค่าไฟฟ้า
     loadLocksFromSheets: รับชำระ · loadRealOccupancy: ลงทะเบียนผู้ค้า · loadRules: กฎระเบียบตลาด */
  var RELOADERS = ['loadAll', 'loadData', 'loadStatus', 'render', 'syncRealVendors',
                   'loadVendorsFromSheets', 'loadLocksFromSheets', 'loadRealOccupancy', 'loadRules'];
  function callReloader(why) {
    for (var i = 0; i < RELOADERS.length; i++) {
      var fn = window[RELOADERS[i]];
      if (typeof fn === 'function') {
        try { fn(); } catch (err) { console.error(why + ':', RELOADERS[i], err); }
        return true;   /* เรียกตัวแรกที่หน้านั้นมีจริงพอ — ตัวถัดไปเป็นของหน้าอื่น */
      }
    }
    return false;
  }

  var _lastRefresh = 0;
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'pm-refresh') return;
    var now = Date.now();
    if (now - _lastRefresh < 400) return;   /* กันสัญญาณซ้ำจากการบันทึกรัว ๆ */
    _lastRefresh = now;
    callReloader('pm-refresh');
  });

  /* ══════════════════════════════════════════════════════════════════════
     บั๊กครึ่งหลังที่พบ 3 ส.ค. 2569 — เรื่อง "ลำดับเวลา" ไม่ใช่เรื่องเงื่อนไข

     shim นี้ถูกฝังไว้ท้าย <body> จึงทำงาน "หลัง" สคริปต์หลักของหน้าเสมอ
     หน้าที่โหลดข้อมูลตอน window.onload ไม่มีปัญหา (onload มาทีหลัง shim)
     แต่รายงาน 01–09 เรียก render() แบบ inline ท้ายสคริปต์ของตัวเอง
     ซึ่งเกิด "ก่อน" shim ติดตั้ง → ตอนนั้น getApiUrl() ยังเป็นตัวเดิมที่คืนค่าว่าง
     render() จึงขึ้นข้อความ "ยังไม่ได้เชื่อมต่อ" แล้วจบ และไม่มีอะไรเรียกซ้ำอีกเลย
     ผลคือรายงานทุกฉบับว่างเปล่าถาวรจนกว่าผู้ใช้จะกดปุ่มรีเฟรชเอง

     แก้แบบไม่ต้องแตะไฟล์รายงานทีละไฟล์: ถ้าหลังหน้าโหลดเสร็จแล้วยังไม่เคยมีคำขอ
     ผ่าน shim เลย แปลว่าหน้านั้น "ตัดสินใจตอนที่ยังไม่มีข้อมูลจริง" → สั่งโหลดใหม่ให้ 1 ครั้ง
     (เช็ค _everFetched จึงไม่ทำให้หน้าที่ทำงานถูกอยู่แล้วยิงซ้ำ)
     ══════════════════════════════════════════════════════════════════════ */
  function kickIfNeverFetched() {
    if (_everFetched) return;
    if (callReloader('pm-late-init')) {
      console.info('PM_API: หน้านี้โหลดข้อมูลก่อน shim พร้อม — สั่งโหลดใหม่ให้อัตโนมัติ');
    }
  }
  if (document.readyState === 'complete') setTimeout(kickIfNeverFetched, 0);
  else window.addEventListener('load', function () { setTimeout(kickIfNeverFetched, 0); });
})();
</script>
