<!-- ==== PM_API_CLIENT:START (สร้างโดย tools/inject_api_client.py — ห้ามแก้ในไฟล์นี้) ==== -->
<script id="pm-api-client">
/* ═══════════════════════════════════════════════════════════════════════════
   PM_API_CLIENT (v3.0) — ตัวเชื่อมต่อฐานข้อมูลชุดกลาง
   แก้ที่ tools/inject_api_client.py เท่านั้น แล้วรันใหม่ · ห้ามแก้ในไฟล์นี้
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  var SB_URL = 'https://atvxajfwazrswdlhnosh.supabase.co';
  var SB_KEY = 'sb_publishable_kGSsjrQvDa9EKaw7CDPeQg_UnkKtCLa';
  var MODE_KEY = 'pm-thu-backend';
  var MODE_MIGRATION_KEY = MODE_KEY + '-migration-v3.2';
  /* iframe ไม่ควรเดาเองว่าเข้าถึง sessionStorage ของหน้าแม่ได้เสมอ: Safari/WebView
     บางแบบแยก storage แม้ URL เดียวกัน. หน้าแม่จะส่ง session ผ่าน postMessage ที่ระบุ origin. */
  var embeddedSession = '';
  window.addEventListener('message', function (event) {
    try {
      if (event.origin !== window.location.origin) return;
      if (event.data && event.data.type === 'pmthu-session' && typeof event.data.session === 'string') {
        embeddedSession = event.data.session;
        /* ผังเริ่มโหลดข้อมูลตั้งแต่ window.onload ซึ่งอาจเร็วกว่าข้อความจากหน้าแม่
           จึงต้องสั่งดึงใหม่ทันทีหลังรับ token ไม่รอ retry รอบเดิมหมดก่อน. */
        if (typeof window.loadVendorOccupancy === 'function') window.loadVendorOccupancy();
        if (typeof window.syncRealVendors === 'function') window.syncRealVendors();
        if (typeof window.loadFromSheets === 'function') window.loadFromSheets();
        if (typeof window.loadAll === 'function') window.loadAll();
      }
    } catch (e) {}
  });
  /* ขอ token แบบ active เพื่อกันกรณี parent ส่งตอน iframe ยังไม่พร้อมรับข้อความ */
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'pm-session-request' }, window.location.origin);
    }
  } catch (e) {}

  /* โหมดปัจจุบัน: sheets (เดิม) · parallel (อ่าน Supabase เขียนสองที่) · supabase (ใหม่ล้วน)
     เปลี่ยนได้จาก console ด้วย PM_API.setMode('parallel') โดยไม่ต้อง deploy ใหม่ */
  function migrateExistingDevice() {
    try {
      /* เครื่องที่เคยใช้รุ่นก่อนจะมีค่า `sheets` ค้างอยู่ใน localStorage.
         การตั้ง default ในโค้ดอย่างเดียวจึงไม่พอ เพราะค่านั้นชนะ default เสมอและทำให้
         แอพดูเหมือนต่อ Supabase ไม่ได้. ย้ายค่าอัตโนมัติครั้งเดียวเมื่อรับรุ่น v3.2;
         หลังจากนั้น setMode('sheets') ยังใช้เป็นทางถอยฉุกเฉินได้ตามปกติ. */
      if (!localStorage.getItem(MODE_MIGRATION_KEY)) {
        localStorage.setItem(MODE_KEY, 'supabase');
        localStorage.setItem(MODE_MIGRATION_KEY, 'done');
        /* session เดิมมาจาก Sheets และไม่มี Supabase session token. ลบทิ้งหนึ่งครั้ง
           เฉพาะหน้าหลักเท่านั้น: iframe ผังใช้ sessionStorage ร่วมกับหน้าหลักในบางเบราว์เซอร์
           จึงห้าม iframe ลบ token ของหน้าที่ผู้ใช้เพิ่งล็อกอินอยู่ ไม่เช่นนั้นผังจะตอบ 401/ว่าง. */
        if (window.top === window) try { sessionStorage.removeItem('pmthu-session'); } catch (e) {}
      }
    } catch (e) {}
  }
  /* ต้องทำทันทีใน head ก่อนโค้ดเดิมเริ่ม restore session/โหลดข้อมูล ไม่ใช่รอให้
     apiGet ถูกเรียกครั้งแรก (ซึ่งช้าเกินไปและทำให้ Sheets ชนะในรอบแรก). */
  migrateExistingDevice();
  function mode() {
    migrateExistingDevice();
    try { return localStorage.getItem(MODE_KEY) || 'supabase'; } catch (e) { return 'supabase'; }
  }

  function sbFetch(action, payload) {
    /* ทุก action วิ่งผ่านฟังก์ชัน api() ตัวเดียวที่ฐานข้อมูล — ตารางทั้งหมดถูกปิดจาก
       การเข้าถึงตรง ๆ ไว้แล้ว ต่อให้ key หลุดก็อ่าน/เขียนตารางเองไม่ได้ */
    var body = Object.assign({}, payload || {});
    /* token อยู่ใน sessionStorage เท่านั้น (ไม่ใช้ localStorage) และฐานข้อมูลเก็บแค่ hash
       ของมัน — action สาธารณะ/verifyUser ไม่ต้องมี token ส่วน action อื่นจะถูกปฏิเสธที่ RPC */
    try {
      var sess = JSON.parse(sessionStorage.getItem('pmthu-session') || 'null');
      /* iframe บางบริบทมี sessionStorage แยกจากหน้าแม่ แม้เป็น origin เดียวกัน.
         ใช้ token ของหน้าแม่เป็น fallback โดยไม่ส่งออกไปที่ใดนอกจาก RPC ของตลาดเดียวกัน. */
      if ((!sess || !sess.apiToken) && embeddedSession) {
        sess = JSON.parse(embeddedSession);
      }
      if ((!sess || !sess.apiToken) && window.parent && window.parent !== window && window.parent.__pmSessionBridge) {
        sess = JSON.parse(window.parent.__pmSessionBridge);
      }
      if ((!sess || !sess.apiToken) && window.parent && window.parent !== window) {
        sess = JSON.parse(window.parent.sessionStorage.getItem('pmthu-session') || 'null');
      }
      if (sess && sess.apiToken) body.sessionToken = sess.apiToken;
    } catch (e) {}
    return fetch(SB_URL + '/rest/v1/rpc/api', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action, payload: body })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 160)); });
      return r.json();
    });
  }

  window.PM_API = {
    mode: mode,
    setMode: function (m) {
      if (['sheets', 'parallel', 'supabase'].indexOf(m) < 0) { console.error('โหมดไม่ถูกต้อง:', m); return; }
      try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
      console.log('PM_API: สลับเป็นโหมด', m, '— รีเฟรชหน้าเพื่อให้มีผลทุกส่วน');
    },
    supabase: sbFetch,
    url: SB_URL,
    /* เทียบผลลัพธ์ Sheets กับ Supabase ของ action เดียวกัน — ใช้ตอนทดสอบคู่ขนาน */
    compare: async function (action, params) {
      var a = null, b = null;
      try { a = await window.__pmSheetsGet(action, params || {}); } catch (e) { a = 'ERROR ' + e.message; }
      try { b = (await sbFetch(action, params || {})).data; } catch (e) { b = 'ERROR ' + e.message; }
      var la = Array.isArray(a) ? a.length : typeof a;
      var lb = Array.isArray(b) ? b.length : typeof b;
      console.log('[' + action + '] Sheets:', la, ' Supabase:', lb, la === lb ? '✅ ตรงกัน' : '⚠️ ต่างกัน');
      return { sheets: a, supabase: b };
    }
  };
})();
</script>

<header class="toolbar"><div><h1>รายงานข้อมูลผู้ค้าปัจจุบัน</h1><p>แพไม้มินิ · แสดงเฉพาะผู้ค้าที่ยังมีสัญญา</p></div><div><button class="btn" onclick="render()">↻ อัปเดต</button> <button class="btn" onclick="print()">พิมพ์ / PDF</button> <button class="btn" onclick="history.back()">← กลับ</button></div></header>
<main class="page"><div class="head"><div><div class="brand">แพไม้มินิ — รายชื่อผู้ค้าปัจจุบัน</div><div style="font-size:.78rem;color:var(--txl);margin-top:3px">โซน · ล็อค · ชื่อ · เบอร์โทร · สินค้า · ค่าเช่า · ค่าไฟ · ยอดรวม</div></div><div class="meta" id="stamp">—</div></div><section class="summary" id="summary"></section><div class="tablewrap"><table><thead><tr><th>โซน</th><th>ล็อค</th><th>ชื่อผู้ค้า</th><th>เบอร์โทร</th><th>สินค้า</th><th class="num">ค่าเช่า/เดือน</th><th class="num">ค่าไฟ/เดือน</th><th class="num">รวม/เดือน</th><th>สถานะ</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">กำลังโหลดข้อมูล…</td></tr></tbody></table></div></main>
<script>
function getApiUrl(){return (localStorage.getItem('pm-thu-api-url')||localStorage.getItem('pm-api-url'))||'';}
function getApiToken(){return (localStorage.getItem('pm-thu-api-token')||localStorage.getItem('pm-api-token'))||'';}
async function apiGet(action,params={}){const u=getApiUrl();if(!u)return null;try{const r=await fetch(u+'?'+new URLSearchParams({action,token:getApiToken(),...params}));const j=await r.json();return j.status==='ok'?j.data:null}catch(e){return null}}
const baht=n=>'฿'+Math.round(n||0).toLocaleString('th-TH');
function daysInMonth(){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),1);let c=0;while(d.getMonth()===n.getMonth()){if(d.getDay()===4)c++;d.setDate(d.getDate()+1)}return c}
function elec(v){const sp=(Array.isArray(v.elec_special)?v.elec_special:[]).reduce((s,x)=>s+(Number(x.price)||0),0);return ((Number(v.elec_bulb)||0)*10+(Number(v.elec_fan)||0)*20+(Number(v.elec_small)||0)*50+(Number(v.elec_large)||0)*100+sp)*daysInMonth()}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function render(){const out=document.getElementById('rows');out.innerHTML='<tr><td colspan="9" class="empty">กำลังโหลดข้อมูล…</td></tr>';const all=await apiGet('getVendors');if(!Array.isArray(all)){out.innerHTML='<tr><td colspan="9" class="error">โหลดข้อมูลไม่สำเร็จ — กรุณาเข้าสู่ระบบและลองใหม่</td></tr>';return}const vs=all.filter(v=>v.status!=='terminated').sort((a,b)=>(a.zone||'').localeCompare(b.zone||'')||String(a.lock).localeCompare(String(b.lock),undefined,{numeric:true}));let rent=0,power=0;out.innerHTML=vs.length?vs.map(v=>{const r=(Number(v.dailyRate)||0)*daysInMonth(),e=elec(v);rent+=r;power+=e;const unpaid=v.status==='unpaid';return '<tr><td>'+esc(v.zone)+'</td><td><b>'+esc(v.lock)+'</b></td><td>'+esc(v.name||'—')+'</td><td>'+esc(v.phone||'—')+'</td><td>'+esc(v.product||'—')+'</td><td class="num">'+baht(r)+'</td><td class="num">'+baht(e)+'</td><td class="num"><b>'+baht(r+e)+'</b></td><td><span class="status '+(unpaid?'unpaid':'')+'">'+(unpaid?'ค้างชำระ':'ปกติ')+'</span></td></tr>'}).join(''):'<tr><td colspan="9" class="empty">ยังไม่มีผู้ค้าปัจจุบัน</td></tr>';document.getElementById('summary').innerHTML='<div class="stat"><b>'+vs.length+'</b><span>ผู้ค้าปัจจุบัน</span></div><div class="stat"><b>'+daysInMonth()+'</b><span>วันตลาดในเดือนนี้</span></div><div class="stat"><b>'+baht(rent)+'</b><span>ค่าเช่า/เดือน</span></div><div class="stat"><b>'+baht(rent+power)+'</b><span>รวมค่าเช่า+ค่าไฟ/เดือน</span></div>';document.getElementById('stamp').textContent='ข้อมูล ณ '+new Date().toLocaleString('th-TH')}
render();
</script>






















<script id="pm-api-shim">
/* apiGet/apiPost เวอร์ชันที่รองรับสามโหมด — เก็บของเดิมไว้เป็น __pmSheets* เพื่อใช้เทียบผล
   และเพื่อให้ย้อนกลับไปใช้ Google Sheets ได้ทันทีถ้าพบปัญหาหน้างาน (ทางถอย) */
(function () {
  /* ══════════════════════════════════════════════════════════════════════
     บั๊กร้ายแรงที่พบ 3 ส.ค. 2569 (ผู้ใช้แจ้งแค่อาการเดียว แต่ต้นเหตุกินไป 10 ไฟล์)

     เดิมบรรทัดนี้เขียนว่า:
         if (typeof apiGet !== 'function' || typeof apiPost !== 'function') return;

     หน้าที่ "อ่านอย่างเดียว" ไม่มีเหตุให้เขียนฟังก์ชัน apiPost เลย —
     ประวัติแจ้งลา และรายงาน 01–09 รวม 10 ไฟล์ มีแต่ apiGet
     shim ทั้งก้อนจึง return ทิ้งตั้งแต่บรรทัดแรกในไฟล์เหล่านั้น ผลคือ:
       · apiGet ไม่ถูกครอบ → ยังยิงไป Google Apps Script ทั้งที่ทั้งระบบย้ายมา Supabase แล้ว
       · getApiUrl() ไม่ถูกครอบ → คืนค่าว่าง (เครื่องใหม่ไม่มี URL ของ Apps Script)
         ทุกหน้าจึงตัดสินว่า "ยังไม่เชื่อมต่อ" แล้วขึ้นข้อความชวนไปตั้งค่า โดยไม่มี error ใด ๆ
     → หน้าประวัติแจ้งลาและรายงานทุกฉบับ **ไม่เคยเห็นข้อมูลจาก Supabase เลย** ตั้งแต่วันตัดจริง
       (อาการที่ผู้ใช้แจ้ง: "แจ้งลาแล้วแต่ประวัติไม่อัปเดต")

     เข้าเงื่อนไขกฎเหล็กข้อ 18 เป๊ะ ๆ อีกครั้ง — คราวนี้ตัวด่านเองเป็นคนปิดสวิตช์
     แก้: บังคับแค่ apiGet เท่านั้น ส่วน apiPost ครอบเมื่อมีจริง
     ══════════════════════════════════════════════════════════════════════ */
  if (typeof apiGet !== 'function') return;
  var _get = apiGet;
  var _post = (typeof apiPost === 'function') ? apiPost : null;
  window.__pmSheetsGet = _get;
  if (_post) window.__pmSheetsPost = _post;
  function notifySaved(action, result) {
    if (!result || result.status !== 'ok' || window.parent === window) return;
    try { window.parent.postMessage({ type: 'pm-data-changed', action: action }, '*'); } catch (e) {}
  }

  var _everFetched = false;   /* ใช้ตรวจว่าหน้านี้ "เคยขอข้อมูลผ่าน shim" แล้วหรือยัง (ดู kickIfNeverFetched) */

  window.apiGet = async function (action, params) {
    _everFetched = true;
    var m = window.PM_API ? window.PM_API.mode() : 'supabase';
    if (m === 'sheets') return _get(action, params);
    try {
      var r = await window.PM_API.supabase(action, params || {});
      return (r && r.status === 'ok') ? r.data : null;
    } catch (e) {
      console.error('Supabase apiGet ล้มเหลว:', action, e);
      /* โหมด parallel ยังมี Sheets เป็นตาข่ายรองรับ · โหมด supabase ล้วนต้องคืน null
         ให้ชั้นบน (PM_VENDOR_SYNC) แสดงแถบเตือนตามปกติ ไม่แอบกลับไปอ่านของเก่าเงียบ ๆ */
      return (m === 'parallel') ? _get(action, params) : null;
    }
  };

  /* หน้าอ่านอย่างเดียว (ประวัติแจ้งลา · รายงาน 01–09) ไม่มี apiPost — ข้ามส่วนนี้ไปได้เลย
     แต่ต้องไม่ข้ามทั้ง shim เหมือนเดิม เพราะ apiGet และ getApiUrl ยังต้องถูกครอบ */
  if (_post) window.apiPost = async function (action, data) {
    var m = window.PM_API ? window.PM_API.mode() : 'supabase';
    if (m === 'sheets') return _post(action, data);
    var sbRes = null, sbErr = null;
    try { sbRes = await window.PM_API.supabase(action, data || {}); }
    catch (e) { sbErr = e; console.error('Supabase apiPost ล้มเหลว:', action, e); }
    if (m === 'parallel') {
      /* เขียนลง Sheets ด้วยเพื่อให้ข้อมูลสองที่ตรงกันระหว่างช่วงทดสอบ
         ถ้าฝั่ง Supabase พลาด ให้ยึดผลจาก Sheets เป็นคำตอบ (ยังไม่ตัดของเก่าทิ้ง) */
      var shRes = null;
      try { shRes = await _post(action, data); } catch (e) {}
      var parallelRes = (sbRes && sbRes.status === 'ok') ? sbRes : shRes;
      notifySaved(action, parallelRes);
      return parallelRes;
    }
    if (sbErr) return { status: 'error', message: String(sbErr.message || sbErr) };
    notifySaved(action, sbRes);
    return sbRes;
  };

  /* ── ด่านที่ลืมไม่ได้: getApiUrl() ──
     ทั้งระบบใช้ `if(!getApiUrl())` เป็นตัวตัดสินว่า "เชื่อมต่อฐานข้อมูลแล้วหรือยัง"
     รวม 89 จุดใน 20 ไฟล์ (นับเมื่อ 28 ก.ค. 2026) — ไม่ใช่แค่ใช้เป็น URL เท่านั้น
     พอย้ายมา Supabase ค่าที่คืนคือ URL ของ Apps Script ซึ่งเครื่องใหม่ไม่มี ทุกด่านจึงตัด
     ฟีเจอร์ทิ้งเงียบ ๆ (ผังขึ้นว่างทั้งตลาด · ปุ่มบันทึกเตือนว่ายังไม่เชื่อมต่อ)
     จึงต้องครอบที่ฟังก์ชันนี้ด้วย ไม่ใช่แค่ apiGet/apiPost

     ⚠️ โหมด parallel ห้ามแทนค่า — เพราะ __pmSheetsPost ยังต้องยิงไป URL จริงของ Apps Script
        ถ้าคืน URL ของ Supabase ไปแทน ข้อมูลจะถูกส่งผิดที่ */
  if (typeof getApiUrl === 'function') {
    var _url = getApiUrl;
    window.__pmSheetsUrl = _url;
    window.getApiUrl = function () {
      var m = window.PM_API ? window.PM_API.mode() : 'supabase';
      var real = '';
      try { real = _url() || ''; } catch (e) {}
      if (m === 'supabase') return real || (window.PM_API ? window.PM_API.url : '');
      if (m === 'parallel' && !real) console.warn('PM_API: โหมด parallel ต้องตั้งค่า URL ของ Apps Script ด้วย');
      return real;
    };
  }

  /* ป้ายเดิมใน shell ถูกเขียนก่อน PM_API shim จะเริ่มทำงาน จึงค้างคำว่า Sheets
     ทั้งที่คำขอจริงวิ่งเข้า Supabase แล้ว. ปรับหลังหน้าโหลดเพื่อให้ผู้ใช้เห็นแหล่งข้อมูลจริง. */
  function refreshConnectionLabels() {
    if (!window.PM_API || window.PM_API.mode() !== 'supabase') return;
    var cloud = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19H9a5 5 0 1 1 1.6-9.7A6 6 0 0 1 22 11.5 4.5 4.5 0 0 1 17.5 19Z"/></svg>';
    var badge = document.getElementById('db-status-badge');
    var side = document.getElementById('db-status');
    if (badge) { badge.innerHTML = cloud + ' Supabase'; badge.title = 'Supabase'; }
    if (side) side.innerHTML = cloud + ' เชื่อมต่อ Supabase แล้ว';
  }
  setTimeout(refreshConnectionLabels, 1200);

  /* ══════════════════════════════════════════════════════════════════════
     PM_REFRESH_BUS (เพิ่ม 2026-08-03) — แก้บั๊ก "บันทึกแล้วแต่หน้าอื่นยังเป็นข้อมูลเก่า"

     ระบบมีสายส่งสัญญาณอยู่แล้วตั้งแต่ v2.2: โมดูลที่บันทึกสำเร็จยิง 'pm-data-changed'
     ขึ้นไปที่ shell → shell กระจาย 'pm-refresh' กลับลงมาทุก iframe
     แต่ "ปลายทาง" มีแค่ 2 ไฟล์ที่เขียน listener ไว้เอง (ผังตลาด + คิวจองล็อคจร)
     อีก 6 โมดูลไม่มีเลย — หน้าประวัติแจ้งลาจึงค้างข้อมูลเก่าจนกว่าจะกด F5 (อาการที่ผู้ใช้แจ้ง)

     แทนที่จะไล่ก๊อป listener ทีละไฟล์ (ซึ่งจะ drift แน่นอนตามกฎเหล็กข้อ 12/20)
     ฝังตัวรับกลางไว้ที่ shim นี้ ซึ่งถูก inject ลง "ทุกไฟล์" อยู่แล้ว
     แต่ละหน้าไม่ต้องรู้อะไรเลย — แค่มีฟังก์ชันโหลดข้อมูลชื่อใดชื่อหนึ่งใน RELOADERS

     ไฟล์ที่เขียน listener ของตัวเองไว้แล้วยังทำงานได้ปกติ (โหลดซ้ำสองรอบไม่เสียหาย
     เพราะทุกตัวเป็นการอ่านข้อมูลอย่างเดียว) และมี throttle 400ms กันยิงรัว
     ══════════════════════════════════════════════════════════════════════ */
  /* เรียงจาก "ชื่อเฉพาะของหน้านั้น" ก่อน — แต่ละหน้ามีตัวเดียวเท่านั้นในทางปฏิบัติ
     loadAll: ประวัติแจ้งลา, คิวจองล็อคจร · loadData: ผ่อนชำระ · loadStatus: หน้าสถานะสาธารณะ
     syncRealVendors: ผังตลาด · loadVendorsFromSheets: ค่าไฟฟ้า
     loadLocksFromSheets: รับชำระ · loadRealOccupancy: ลงทะเบียนผู้ค้า · loadRules: กฎระเบียบตลาด */
  var RELOADERS = ['loadAll', 'loadData', 'loadStatus', 'render', 'syncRealVendors',
                   'loadVendorsFromSheets', 'loadLocksFromSheets', 'loadRealOccupancy', 'loadRules'];
  function callReloader(why) {
    for (var i = 0; i < RELOADERS.length; i++) {
      var fn = window[RELOADERS[i]];
      if (typeof fn === 'function') {
        try { fn(); } catch (err) { console.error(why + ':', RELOADERS[i], err); }
        return true;   /* เรียกตัวแรกที่หน้านั้นมีจริงพอ — ตัวถัดไปเป็นของหน้าอื่น */
      }
    }
    return false;
  }

  var _lastRefresh = 0;
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'pm-refresh') return;
    var now = Date.now();
    if (now - _lastRefresh < 400) return;   /* กันสัญญาณซ้ำจากการบันทึกรัว ๆ */
    _lastRefresh = now;
    callReloader('pm-refresh');
  });

  /* ══════════════════════════════════════════════════════════════════════
     บั๊กครึ่งหลังที่พบ 3 ส.ค. 2569 — เรื่อง "ลำดับเวลา" ไม่ใช่เรื่องเงื่อนไข

     shim นี้ถูกฝังไว้ท้าย <body> จึงทำงาน "หลัง" สคริปต์หลักของหน้าเสมอ
     หน้าที่โหลดข้อมูลตอน window.onload ไม่มีปัญหา (onload มาทีหลัง shim)
     แต่รายงาน 01–09 เรียก render() แบบ inline ท้ายสคริปต์ของตัวเอง
     ซึ่งเกิด "ก่อน" shim ติดตั้ง → ตอนนั้น getApiUrl() ยังเป็นตัวเดิมที่คืนค่าว่าง
     render() จึงขึ้นข้อความ "ยังไม่ได้เชื่อมต่อ" แล้วจบ และไม่มีอะไรเรียกซ้ำอีกเลย
     ผลคือรายงานทุกฉบับว่างเปล่าถาวรจนกว่าผู้ใช้จะกดปุ่มรีเฟรชเอง

     แก้แบบไม่ต้องแตะไฟล์รายงานทีละไฟล์: ถ้าหลังหน้าโหลดเสร็จแล้วยังไม่เคยมีคำขอ
     ผ่าน shim เลย แปลว่าหน้านั้น "ตัดสินใจตอนที่ยังไม่มีข้อมูลจริง" → สั่งโหลดใหม่ให้ 1 ครั้ง
     (เช็ค _everFetched จึงไม่ทำให้หน้าที่ทำงานถูกอยู่แล้วยิงซ้ำ)
     ══════════════════════════════════════════════════════════════════════ */
  function kickIfNeverFetched() {
    if (_everFetched) return;
    if (callReloader('pm-late-init')) {
      console.info('PM_API: หน้านี้โหลดข้อมูลก่อน shim พร้อม — สั่งโหลดใหม่ให้อัตโนมัติ');
    }
  }
  if (document.readyState === 'complete') setTimeout(kickIfNeverFetched, 0);
  else window.addEventListener('load', function () { setTimeout(kickIfNeverFetched, 0); });
})();
</script>
</body>
</html>
